<script id="v245-supervision-runtime">
// =============================================================================
// V245 fixed supervision UI. This wraps only Course-list/navigation functions;
// regular Course rendering and every pre-existing section remain unchanged.
// =============================================================================
var CURRENT_SUPERVISION_V245=null;
var SUPERVISION_HOME_V245={};
var SUPERVISION_UNIT_V245={};
var SUPERVISION_LOADING_HOME_V245={};
var SUPERVISION_LOADING_UNIT_V245={};
var SUPERVISION_FOLDER_LOADING_V245={};
var SUPERVISION_TYPES_V245=[
  {Type:'MAGANG',Label:'Magang',Meta:'Individual · grouped by company'},
  {Type:'CAPSTONE',Label:'Capstone',Meta:'Group supervision'},
  {Type:'SKRIPSI',Label:'Skripsi',Meta:'Individual supervision'}
];

function supervisionHomeKeyV245(type){return String(SELECTED_PERIOD_ID||'')+'::'+String(type||'').toUpperCase()}
function supervisionCurrentHomeV245(){return CURRENT_SUPERVISION_V245?SUPERVISION_HOME_V245[supervisionHomeKeyV245(CURRENT_SUPERVISION_V245.type)]:null}
function supervisionCurrentUnitV245(){return CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId?SUPERVISION_UNIT_V245[CURRENT_SUPERVISION_V245.unitId]:null}
function supervisionTypeLabelV245(type){var x=SUPERVISION_TYPES_V245.find(function(t){return t.Type===String(type||'').toUpperCase()});return x?x.Label:String(type||'')}

var renderCourseListBeforeV245=renderCourseList;
renderCourseList=function(){
  var host=document.getElementById('courseList');
  var old=host?host.scrollTop:0;
  renderCourseListBeforeV245();
  host=document.getElementById('courseList');
  if(!host||!SELECTED_PERIOD_ID)return;

  var q=String(SEARCH||'').trim().toLowerCase();
  var types=SUPERVISION_TYPES_V245.filter(function(x){
    return !q||[x.Label,x.Meta,'supervision','bimbingan'].join(' ').toLowerCase().indexOf(q)>=0;
  });
  if(!types.length)return;

  var html='<div class="supervisionDividerV245">Supervision</div>'+types.map(function(x){
    var active=CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===x.Type;
    return'<button class="courseCard supervisionCardV245 '+(active?'active':'')+'" type="button" onclick="openSupervisionV245(\''+x.Type+'\')">'+
      '<div class="courseTitle">'+esc(x.Label)+'</div><div class="courseMeta">'+esc(x.Meta)+'</div></button>';
  }).join('');
  host.insertAdjacentHTML('afterbegin',html);
  host.scrollTop=old;
};

var openTeachingBeforeV245=openTeaching;
openTeaching=function(id){CURRENT_SUPERVISION_V245=null;return openTeachingBeforeV245(id)};

var openCoursesHomeBeforeV245=openCoursesHome;
openCoursesHome=function(){CURRENT_SUPERVISION_V245=null;return openCoursesHomeBeforeV245()};

var changePeriodBeforeV245=changePeriod;
changePeriod=function(id){CURRENT_SUPERVISION_V245=null;return changePeriodBeforeV245(id)};

function openSupervisionV245(type){
  type=String(type||'').toUpperCase();
  if(!SELECTED_PERIOD_ID)return;
  CURRENT_TEACHING_ID='';
  EDIT_MODE=false;
  CURRENT_SUPERVISION_V245={type:type,unitId:''};
  document.body.classList.add('detailOpen');
  document.body.classList.remove('homeOpen');
  renderCourseList();
  renderSupervisionV245();
  loadSupervisionHomeV245(false);
}

function backFromSupervisionV245(){
  if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId){
    CURRENT_SUPERVISION_V245.unitId='';
    renderSupervisionV245();
    return;
  }
  CURRENT_SUPERVISION_V245=null;
  document.body.classList.remove('detailOpen','homeOpen');
  renderCourseList();
  if(!compact())renderHome(false);
}

function loadSupervisionHomeV245(force){
  if(!CURRENT_SUPERVISION_V245||!SELECTED_PERIOD_ID)return;
  var type=CURRENT_SUPERVISION_V245.type,key=supervisionHomeKeyV245(type);
  if(!force&&SUPERVISION_HOME_V245[key]){renderSupervisionV245();return}
  if(SUPERVISION_LOADING_HOME_V245[key])return;
  SUPERVISION_LOADING_HOME_V245[key]=true;
  renderSupervisionV245();
  google.script.run.withSuccessHandler(function(r){
    SUPERVISION_LOADING_HOME_V245[key]=false;
    SUPERVISION_HOME_V245[key]=r||{units:[],count:0,type:type,periodLabel:''};
    if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===type&&!CURRENT_SUPERVISION_V245.unitId)renderSupervisionV245();
  }).withFailureHandler(function(e){
    SUPERVISION_LOADING_HOME_V245[key]=false;
    if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===type)renderSupervisionV245();
    failKeepUi(e);
  }).getSupervisionHomeV245(SELECTED_PERIOD_ID,type,ACCESS_KEY);
}

function openSupervisionUnitV245(unitId){
  if(!CURRENT_SUPERVISION_V245)return;
  CURRENT_SUPERVISION_V245.unitId=String(unitId||'');
  renderSupervisionV245();
  loadSupervisionUnitV245(unitId,false);
}

function loadSupervisionUnitV245(unitId,force){
  unitId=String(unitId||'');if(!unitId)return;
  if(!force&&SUPERVISION_UNIT_V245[unitId]){renderSupervisionV245();ensureSupervisionFolderBackgroundV245(unitId);return}
  if(SUPERVISION_LOADING_UNIT_V245[unitId])return;
  SUPERVISION_LOADING_UNIT_V245[unitId]=true;renderSupervisionV245();
  google.script.run.withSuccessHandler(function(r){
    SUPERVISION_LOADING_UNIT_V245[unitId]=false;
    SUPERVISION_UNIT_V245[unitId]=r||null;
    if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();
    ensureSupervisionFolderBackgroundV245(unitId);
  }).withFailureHandler(function(e){
    SUPERVISION_LOADING_UNIT_V245[unitId]=false;
    if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();
    failKeepUi(e);
  }).getSupervisionUnitV245(unitId,ACCESS_KEY);
}

function ensureSupervisionFolderBackgroundV245(unitId){
  unitId=String(unitId||'');if(!unitId||SUPERVISION_FOLDER_LOADING_V245[unitId])return;
  var packet=SUPERVISION_UNIT_V245[unitId];
  if(packet&&packet.unit&&packet.unit.Folder_URL)return;
  SUPERVISION_FOLDER_LOADING_V245[unitId]=true;
  google.script.run.withSuccessHandler(function(r){
    delete SUPERVISION_FOLDER_LOADING_V245[unitId];
    var p=SUPERVISION_UNIT_V245[unitId];
    if(p&&p.unit&&r){p.unit.Folder_ID=r.Folder_ID||'';p.unit.Folder_URL=r.Folder_URL||''}
    var home=supervisionCurrentHomeV245();
    if(home){var u=(home.units||[]).find(function(x){return x.Unit_ID===unitId});if(u&&r){u.Folder_ID=r.Folder_ID||'';u.Folder_URL=r.Folder_URL||''}}
    if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();
  }).withFailureHandler(function(){delete SUPERVISION_FOLDER_LOADING_V245[unitId]}).ensureSupervisionUnitFolderV245(unitId,ACCESS_KEY);
}

function renderSupervisionV245(){
  var host=document.getElementById('content');if(!host||!CURRENT_SUPERVISION_V245)return;
  host.innerHTML='<div class="supervisionShellV245">'+(CURRENT_SUPERVISION_V245.unitId?renderSupervisionUnitDetailV245():renderSupervisionOverviewV245())+'</div>';
}

function renderSupervisionOverviewV245(){
  var type=CURRENT_SUPERVISION_V245.type;
  var key=supervisionHomeKeyV245(type),data=SUPERVISION_HOME_V245[key];
  var loading=!!SUPERVISION_LOADING_HOME_V245[key];
  var label=supervisionTypeLabelV245(type);
  var period=data&&data.periodLabel?data.periodLabel:periodLabel(selectedPeriod());
  var count=data?Number(data.count||0):0;
  var noun=type==='CAPSTONE'?'group'+(count===1?'':'s'):'student'+(count===1?'':'s');
  var addLabel=type==='CAPSTONE'?'+ Group':'+ Student';
  var body='';
  if(!data){body='<div class="placeholder" style="margin-top:18px">'+(loading?'Loading '+esc(label)+'…':'Open to load.')+'</div>'}
  else if(!(data.units||[]).length){body='<div class="placeholder" style="margin-top:18px">No '+(type==='CAPSTONE'?'groups':'students')+' yet.</div>'}
  else if(type==='MAGANG'){body=renderMagangGroupsV245(data.units||[])}
  else{body='<div class="supervisionGroupV245"><div class="supervisionUnitListV245">'+(data.units||[]).map(renderSupervisionUnitCardV245).join('')+'</div></div>'}
  return'<button class="btn compactBack" type="button" onclick="backFromSupervisionV245()">← Courses</button>'+
    '<div class="supervisionTopV245"><div><h2>'+esc(label)+'</h2><div class="muted">'+esc(period)+' · '+count+' '+noun+'</div></div>'+
    '<div class="supervisionActionsV245"><button class="btn" type="button" onclick="openAddSupervisionUnitV245()">'+addLabel+'</button></div></div>'+body;
}

function renderMagangGroupsV245(units){
  var groups={};
  (units||[]).forEach(function(u){var c=String(u.Company||'').trim()||'Belum dikelompokkan';if(!groups[c])groups[c]=[];groups[c].push(u)});
  return Object.keys(groups).sort(function(a,b){return a.localeCompare(b)}).map(function(company){
    var rows=groups[company];
    return'<div class="supervisionGroupV245"><div class="supervisionGroupHeadV245"><span>'+esc(company)+'</span><span class="muted">'+rows.length+' student'+(rows.length===1?'':'s')+'</span></div><div class="supervisionUnitListV245">'+rows.map(renderSupervisionUnitCardV245).join('')+'</div></div>';
  }).join('');
}

function renderSupervisionUnitCardV245(u){
  var type=String(u.Type||'').toUpperCase();
  var meta=[];
  if(type==='CAPSTONE'){
    var members=(u.Members||[]).map(function(m){return m.Name}).filter(Boolean);
    if(members.length)meta.push(members.join(' · '));
    if(u.Topic)meta.push(u.Topic);
  }else{
    if(u.NPM)meta.push(u.NPM);
    if(type==='SKRIPSI'&&u.Topic)meta.push(u.Topic);
  }
  meta.push(Number(u.File_Count||0)+' file'+(Number(u.File_Count||0)===1?'':'s'));
  return'<button class="supervisionUnitV245 '+(u._Pending?'supervisionPendingV245':'')+'" type="button" '+(u._Pending?'disabled ':'')+'onclick="openSupervisionUnitV245(\''+esc(u.Unit_ID)+'\')">'+
    '<div class="supervisionUnitTitleV245">'+esc(u.Name)+(u._Pending?' <span class="pendingSpinnerV204"></span>':'')+'</div>'+
    '<div class="supervisionUnitMetaV245">'+esc(meta.filter(Boolean).join(' · '))+'</div>'+((u.Last_Activity||'')?'<div class="supervisionUnitActivityV245">Last activity · '+esc(u.Last_Activity)+'</div>':'')+'</button>';
}

function renderSupervisionUnitDetailV245(){
  var unitId=CURRENT_SUPERVISION_V245.unitId,packet=SUPERVISION_UNIT_V245[unitId];
  if(!packet)return'<button class="btn supervisionBackV245" type="button" onclick="backFromSupervisionV245()">← Back</button><div class="placeholder">'+(SUPERVISION_LOADING_UNIT_V245[unitId]?'Loading…':'Loading supervision…')+'</div>';
  var u=packet.unit||{},type=String(u.Type||'').toUpperCase();
  var sub=[];
  if(type==='MAGANG'){if(u.NPM)sub.push(u.NPM);if(u.Company)sub.push(u.Company)}
  if(type==='SKRIPSI'){if(u.NPM)sub.push(u.NPM);if(u.Topic)sub.push(u.Topic)}
  if(type==='CAPSTONE'&&u.Topic)sub.push(u.Topic);
  var members=type==='CAPSTONE'&&Array.isArray(u.Members)&&u.Members.length?'<div class="supervisionMembersV245">'+u.Members.map(function(m){return'<span class="supervisionMemberV245">'+esc((m.NPM?m.NPM+' · ':'')+m.Name)+'</span>'}).join('')+'</div>':'';
  var folder=u.Folder_URL?'<a class="btn" href="'+esc(u.Folder_URL)+'" target="_blank" rel="noopener">📁 Folder</a>':'<button class="btn" type="button" disabled>📁 Preparing…</button>';
  var files=packet.files||[],logs=packet.logs||[];
  return'<button class="btn supervisionBackV245" type="button" onclick="backFromSupervisionV245()">← Back</button>'+
    '<div class="supervisionTopV245"><div><h2>'+esc(u.Name||'Supervision')+'</h2><div class="muted">'+esc(sub.join(' · '))+'</div>'+members+'</div><div class="supervisionActionsV245"><button class="btn" type="button" onclick="openAddSupervisionNoteV245()">+ Note</button><button class="btn" type="button" onclick="openAddSupervisionFileV245()">+ File</button>'+folder+'</div></div>'+
    '<section class="supervisionSectionV245"><div class="supervisionSectionHeadV245"><div class="supervisionSectionTitleV245">Files</div><div class="muted">'+files.length+' file'+(files.length===1?'':'s')+'</div></div>'+renderSupervisionFilesV245(files)+'</section>'+
    '<section class="supervisionSectionV245"><div class="supervisionSectionHeadV245"><div class="supervisionSectionTitleV245">Log</div><div class="muted">'+logs.length+' entries</div></div>'+renderSupervisionLogV245(logs)+'</section>';

<script id="v246-supervision-pass-runtime">

// attendance, assignments, grades, Assistant, Tasks, Materials, and scoring are untouched.
var SUPERVISION_PASS_ARMED_V246={};
var SUPERVISION_PASS_BUSY_V246={};

function loadSupervisionHomeV245(force){
  if(!CURRENT_SUPERVISION_V245||!SELECTED_PERIOD_ID)return;
  var type=CURRENT_SUPERVISION_V245.type,key=supervisionHomeKeyV245(type);
  if(!force&&SUPERVISION_HOME_V245[key]){renderSupervisionV245();return}
  if(SUPERVISION_LOADING_HOME_V245[key])return;
  SUPERVISION_LOADING_HOME_V245[key]=true;renderSupervisionV245();
  google.script.run.withSuccessHandler(function(r){
    SUPERVISION_LOADING_HOME_V245[key]=false;
    SUPERVISION_HOME_V245[key]=r||{type:type,periodId:SELECTED_PERIOD_ID,count:0,units:[]};
    if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===type)renderSupervisionV245();
  }).withFailureHandler(function(e){
    SUPERVISION_LOADING_HOME_V245[key]=false;
    if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===type)renderSupervisionV245();
    failKeepUi(e);
  }).getSupervisionHomeV246(SELECTED_PERIOD_ID,type,ACCESS_KEY);
}

function loadSupervisionUnitV245(unitId,force){

function renderSupervisionUnitCardV245(u){
  var type=String(u.Type||'').toUpperCase();
  var meta=[];
  if(type==='CAPSTONE'){
    var members=(Array.isArray(u.Members_Current)?u.Members_Current:(u.Members||[]));
    var names=members.map(function(m){return(String(m.Status||'').toUpperCase()==='PASSED'?'✓ ':'')+String(m.Name||'')}).filter(Boolean);
    if(names.length)meta.push(names.join(' · '));
    if(u.Topic)meta.push(u.Topic);
    if(Number(u.Passed_Member_Count||0))meta.push(Number(u.Passed_Member_Count||0)+' passed');
  }else{
    if(u.NPM)meta.push(u.NPM);
    if(type==='SKRIPSI'&&u.Topic)meta.push(u.Topic);
  }
  meta.push(Number(u.File_Count||0)+' file'+(Number(u.File_Count||0)===1?'':'s'));
  var passed=type!=='CAPSTONE'&&String(u.Status||'').toUpperCase()==='PASSED';
  var status=passed?'<span class="supervisionPassBadgeV246">✓ Lulus</span>':'';
  var continued=u.Continued?'<div class="supervisionContinueV246">Continued from '+esc(u.Started_Period_Label||'previous period')+'</div>':'';
  return'<button class="supervisionUnitV245 '+(u._Pending?'supervisionPendingV245':'')+'" type="button" '+(u._Pending?'disabled ':'')+'onclick="openSupervisionUnitV245(\''+esc(u.Unit_ID)+'\')">'+
    '<div class="supervisionUnitTitleV245" style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'+esc(u.Name)+(u._Pending?' <span class="pendingSpinnerV204"></span>':'')+status+'</div>'+
    '<div class="supervisionUnitMetaV245">'+esc(meta.filter(Boolean).join(' · '))+'</div>'+continued+((u.Last_Activity||'')?'<div class="supervisionUnitActivityV245">Last activity · '+esc(u.Last_Activity)+'</div>':'')+'</button>';
}

function markSupervisionPassedV246(unitId,memberIndex){
  unitId=String(unitId||'');memberIndex=Number(memberIndex);
  var key=supervisionPassKeyV246(unitId,memberIndex);
  if(SUPERVISION_PASS_BUSY_V246[key])return;
  if(!SUPERVISION_PASS_ARMED_V246[key]){
    SUPERVISION_PASS_ARMED_V246[key]=true;
    renderSupervisionV245();
    return;
  }
  delete SUPERVISION_PASS_ARMED_V246[key];
  SUPERVISION_PASS_BUSY_V246[key]=true;
  renderSupervisionV245();
  google.script.run.withSuccessHandler(function(){
    delete SUPERVISION_PASS_BUSY_V246[key];
    delete SUPERVISION_UNIT_V245[unitId];
    var homeKey=supervisionHomeKeyV245(CURRENT_SUPERVISION_V245?CURRENT_SUPERVISION_V245.type:'');
    if(homeKey)delete SUPERVISION_HOME_V245[homeKey];
    toast('Status lulus tersimpan.');
    loadSupervisionUnitV245(unitId,true);
    if(CURRENT_SUPERVISION_V245)setTimeout(function(){loadSupervisionHomeV245(true)},0);
  }).withFailureHandler(function(e){
    delete SUPERVISION_PASS_BUSY_V246[key];
    renderSupervisionV245();
    failKeepUi(e);
  }).markSupervisionStudentPassedV246(unitId,memberIndex,ACCESS_KEY);
}
</script>

<script id="v247-supervision-continuity-runtime">
// =============================================================================
// V247 — only overrides list ordering + the V245/V246 Supervision subsystem.
// Every regular Course section/function remains on the existing implementation.
// =============================================================================
var SUPERVISION_EDIT_MODE_V247=false;
var SUPERVISION_STUDENTS_VIEW_V247=false;
var SUPERVISION_STUDENTS_V247={};
var SUPERVISION_STUDENTS_LOADING_V247={};
var SUPERVISION_PASS_BUSY_V247={};
var SUPERVISION_RECENCY_V247={MAGANG:0,CAPSTONE:0,SKRIPSI:0};

// ------------------------- REGULAR COURSE ORDER -------------------------
function courseLastEditedMsV247(t){
  var a=ACTIVITY_SUMMARY&&ACTIVITY_SUMMARY[t&&t.Teaching_ID]||{};
  var fromSummary=Number(a.lastEditedMs||0);
  if(fromSummary)return fromSummary;
  var raw=String(t&&t.Date_Updated||'').trim();
  if(!raw)return 0;
  var d=new Date(raw.replace(' ','T'));
  return isNaN(d.getTime())?0:d.getTime();
}

var renderCourseListBeforeV247=renderCourseList;
renderCourseList=function(){
  var host=document.getElementById('courseList');
  if(!host)return;

  var old=host.scrollTop;
  var q=String(SEARCH||'').trim().toLowerCase();

  var regular=(HOME&&HOME.teachings||[]).filter(function(t){
    return !q||[
      t.Course_Name,
      t.Course_Code,
      (t.Classes||[]).join(' ')
    ].join(' ').toLowerCase().indexOf(q)>=0;
  });

  var supervision=SELECTED_PERIOD_ID
    ?SUPERVISION_TYPES_V245.filter(function(x){
      return !q||[
        x.Label,
        x.Meta,
        'supervision',
        'bimbingan'
      ].join(' ').toLowerCase().indexOf(q)>=0;
    })
    :[];

  document.getElementById('courseCount').textContent=
    regular.length+' course'+(regular.length===1?'':'s');

  var items=[];

  regular.forEach(function(t){
    items.push({
      kind:'course',
      edited:courseLastEditedMsV247(t),
      name:String(t.Course_Name||''),
      teaching:t
    });
  });

  supervision.forEach(function(x){
    items.push({
      kind:'supervision',
      edited:Number(SUPERVISION_RECENCY_V247[x.Type]||0),
      name:String(x.Label||''),
      supervision:x
    });
  });

  items.sort(function(a,b){
    var d=Number(b.edited||0)-Number(a.edited||0);
    if(d)return d;
    return String(a.name||'').localeCompare(String(b.name||''));
  });

  host.innerHTML=items.length?items.map(function(item){
    if(item.kind==='supervision'){
      var x=item.supervision;
      var active=CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===x.Type;
      return'<button class="courseCard supervisionCardV245 '+(active?'active':'')+
        '" type="button" onclick="openSupervisionV245(\''+x.Type+'\')">'+
          '<div class="courseTitle">'+esc(x.Label)+'</div>'+
          '<div class="courseMeta">'+esc(x.Meta)+'</div>'+
        '</button>';
    }

    var t=item.teaching;
    var a=ACTIVITY_SUMMARY[t.Teaching_ID]||{};
    var activity=[];
    if(Number(a.openTasks||0)){
      activity.push(a.openTasks+' task'+(Number(a.openTasks)===1?'':'s'));
    }
    if(a.nextAssignment){
      activity.push('Next: '+a.nextAssignment.Title);
    }

    return'<button class="courseCard '+(CURRENT_TEACHING_ID===t.Teaching_ID?'active':'')+
      '" type="button" onclick="openTeaching(\''+esc(t.Teaching_ID)+'\')">'+
        '<div class="courseTitle">'+esc(t.Course_Name)+
          (t.pending?' <span class="pendingText">⏳</span>':'')+
        '</div>'+
        '<div class="courseMeta">'+esc(classesText(t.Classes))+'</div>'+
        (activity.length
          ?'<div class="courseActivity">'+esc(activity.join(' · '))+'</div>'
          :'')+
      '</button>';
  }).join(''):'<div class="muted">No courses in this period.</div>';

  host.scrollTop=old;
};

function loadActivitySummary(){
  if(!SELECTED_PERIOD_ID)return;
  setTimeout(loadHomeTasksV202,0);

  google.script.run
    .withSuccessHandler(function(r){
      ACTIVITY_SUMMARY=r&&r.summary||{};
      SUPERVISION_RECENCY_V247=r&&r.supervisionRecency||{
        MAGANG:0,
        CAPSTONE:0,
        SKRIPSI:0
      };
      renderCourseList();

      if(!CURRENT_TEACHING_ID&&!CURRENT_SUPERVISION_V245){
        renderHome(document.body.classList.contains('homeOpen'));
      }
    })
    .withFailureHandler(function(){})
    .getCoursesPeriodActivitySummaryV247(
      SELECTED_PERIOD_ID,
      ACCESS_KEY
    );
}

// ------------------------- SUPERVISION NAV STATE -------------------------
var openSupervisionBeforeV247=openSupervisionV245;
openSupervisionV245=function(type){
  SUPERVISION_EDIT_MODE_V247=false;
  SUPERVISION_STUDENTS_VIEW_V247=false;
  return openSupervisionBeforeV247(type);
};

var openTeachingBeforeV247=openTeaching;
openTeaching=function(id){
  SUPERVISION_EDIT_MODE_V247=false;
  SUPERVISION_STUDENTS_VIEW_V247=false;
  return openTeachingBeforeV247(id);
};

var openCoursesHomeBeforeV247=openCoursesHome;
openCoursesHome=function(){
  SUPERVISION_EDIT_MODE_V247=false;
  SUPERVISION_STUDENTS_VIEW_V247=false;
  return openCoursesHomeBeforeV247();
};

var changePeriodBeforeV247=changePeriod;
changePeriod=function(id){
  SUPERVISION_EDIT_MODE_V247=false;
  SUPERVISION_STUDENTS_VIEW_V247=false;
  return changePeriodBeforeV247(id);
};

function backFromSupervisionV245(){
  if(!CURRENT_SUPERVISION_V245)return;

  if(CURRENT_SUPERVISION_V245.unitId){
    var wasArchive=!!CURRENT_SUPERVISION_V245.archive;
    CURRENT_SUPERVISION_V245.unitId='';
    CURRENT_SUPERVISION_V245.archive=false;
    if(wasArchive&&CURRENT_SUPERVISION_V245.fromStudents){
      CURRENT_SUPERVISION_V245.fromStudents=false;
      SUPERVISION_STUDENTS_VIEW_V247=true;
      renderSupervisionV245();
      return;
    }
    renderSupervisionV245();
    return;
  }

  if(SUPERVISION_STUDENTS_VIEW_V247){
    SUPERVISION_STUDENTS_VIEW_V247=false;
    renderSupervisionV245();
    return;
  }

  CURRENT_SUPERVISION_V245=null;
  SUPERVISION_EDIT_MODE_V247=false;
  document.body.classList.remove('detailOpen','homeOpen');
  renderCourseList();
  if(!compact())renderHome(false);
}

// ------------------------- CONTINUOUS ACTIVE HOME -------------------------
function loadSupervisionHomeV245(force){
  if(!CURRENT_SUPERVISION_V245||!SELECTED_PERIOD_ID)return;
  var type=CURRENT_SUPERVISION_V245.type,key=supervisionHomeKeyV245(type);

  if(!force&&SUPERVISION_HOME_V245[key]){
    renderSupervisionV245();
    return;
  }
  if(SUPERVISION_LOADING_HOME_V245[key])return;

  SUPERVISION_LOADING_HOME_V245[key]=true;
  renderSupervisionV245();

  google.script.run
    .withSuccessHandler(function(r){
      SUPERVISION_LOADING_HOME_V245[key]=false;
      SUPERVISION_HOME_V245[key]=r||{
        type:type,
        periodId:SELECTED_PERIOD_ID,
        count:0,
        units:[]
      };
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===type){
        renderSupervisionV245();
      }
    })
    .withFailureHandler(function(e){
      SUPERVISION_LOADING_HOME_V245[key]=false;
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===type){
        renderSupervisionV245();
      }
      failKeepUi(e);
    })
    .getSupervisionHomeV247(
      SELECTED_PERIOD_ID,
      type,
      ACCESS_KEY
    );
}

function loadSupervisionUnitV245(unitId,force){
  unitId=String(unitId||'');
  if(!unitId)return;

  var archive=!!(
    CURRENT_SUPERVISION_V245 &&
    CURRENT_SUPERVISION_V245.archive &&
    CURRENT_SUPERVISION_V245.unitId===unitId
  );

  if(!force&&SUPERVISION_UNIT_V245[unitId]){
    renderSupervisionV245();
    if(!archive)ensureSupervisionFolderBackgroundV245(unitId);
    return;
  }
  if(SUPERVISION_LOADING_UNIT_V245[unitId])return;

  SUPERVISION_LOADING_UNIT_V245[unitId]=true;
  renderSupervisionV245();

  var runner=google.script.run
    .withSuccessHandler(function(r){
      SUPERVISION_LOADING_UNIT_V245[unitId]=false;
      SUPERVISION_UNIT_V245[unitId]=r||null;
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId){
        renderSupervisionV245();
      }
      if(!archive)ensureSupervisionFolderBackgroundV245(unitId);
    })
    .withFailureHandler(function(e){
      SUPERVISION_LOADING_UNIT_V245[unitId]=false;
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId){
        renderSupervisionV245();
      }
      failKeepUi(e);
    });

  if(archive){
    runner.getSupervisionUnitArchiveV247(unitId,ACCESS_KEY);
  }else{
    runner.getSupervisionUnitV247(unitId,SELECTED_PERIOD_ID,ACCESS_KEY);
  }
}

// ------------------------- EDIT MODE / ARCHIVE -------------------------
function startSupervisionEditModeV247(){
  SUPERVISION_EDIT_MODE_V247=true;
  SUPERVISION_STUDENTS_VIEW_V247=false;
  renderSupervisionV245();
}

function finishSupervisionEditModeV247(){
  SUPERVISION_EDIT_MODE_V247=false;
  SUPERVISION_STUDENTS_VIEW_V247=false;
  renderSupervisionV245();
}

function supervisionStudentsKeyV247(type){
  return String(SELECTED_PERIOD_ID||'')+'::'+String(type||'').toUpperCase();
}

function openSupervisionStudentsV247(){
  if(!CURRENT_SUPERVISION_V245)return;
  SUPERVISION_STUDENTS_VIEW_V247=true;
  CURRENT_SUPERVISION_V245.unitId='';
  CURRENT_SUPERVISION_V245.archive=false;
  renderSupervisionV245();
  loadSupervisionStudentsV247(false);
}

function loadSupervisionStudentsV247(force){
  if(!CURRENT_SUPERVISION_V245||!SELECTED_PERIOD_ID)return;
  var type=CURRENT_SUPERVISION_V245.type;
  var key=supervisionStudentsKeyV247(type);

  if(!force&&SUPERVISION_STUDENTS_V247[key]){
    renderSupervisionV245();
    return;
  }
  if(SUPERVISION_STUDENTS_LOADING_V247[key])return;

  SUPERVISION_STUDENTS_LOADING_V247[key]=true;
  renderSupervisionV245();

  google.script.run
    .withSuccessHandler(function(r){
      SUPERVISION_STUDENTS_LOADING_V247[key]=false;
      SUPERVISION_STUDENTS_V247[key]=r||{rows:[]};
      if(CURRENT_SUPERVISION_V245&&SUPERVISION_STUDENTS_VIEW_V247){
        renderSupervisionV245();
      }
    })
    .withFailureHandler(function(e){
      SUPERVISION_STUDENTS_LOADING_V247[key]=false;
      renderSupervisionV245();
      failKeepUi(e);
    })
    .getSupervisionStudentsV247(
      SELECTED_PERIOD_ID,
      type,
      ACCESS_KEY
    );
}

function openSupervisionArchiveUnitV247(unitId){
  if(!CURRENT_SUPERVISION_V245)return;
  CURRENT_SUPERVISION_V245.unitId=String(unitId||'');
  CURRENT_SUPERVISION_V245.archive=true;
  CURRENT_SUPERVISION_V245.fromStudents=true;
  SUPERVISION_STUDENTS_VIEW_V247=false;
  delete SUPERVISION_UNIT_V245[unitId];
  renderSupervisionV245();
  loadSupervisionUnitV245(unitId,true);
}

function renderSupervisionEditFooterV247(){
  if(!SUPERVISION_EDIT_MODE_V247){
    return'<div class="supervisionEditFooterV247">'+
      '<button class="btn" type="button" onclick="startSupervisionEditModeV247()">Edit Mode</button>'+
    '</div>';
  }

  return'<div class="supervisionEditFooterV247">'+
    '<button class="btn" type="button" onclick="openSupervisionStudentsV247()">See students</button>'+
    '<button class="btn" type="button" onclick="finishSupervisionEditModeV247()">Finish Edit Mode</button>'+
  '</div>';
}

// ------------------------- RENDER -------------------------
function renderSupervisionV245(){
  var host=document.getElementById('content');
  if(!host||!CURRENT_SUPERVISION_V245)return;

  var body='';
  if(SUPERVISION_STUDENTS_VIEW_V247){
    body=renderSupervisionStudentsV247();
  }else if(CURRENT_SUPERVISION_V245.unitId){
    body=renderSupervisionUnitDetailV245();
  }else{
    body=renderSupervisionOverviewV245();
  }

  host.innerHTML='<div class="supervisionShellV245">'+body+'</div>';
}

function renderSupervisionOverviewV245(){
  var type=CURRENT_SUPERVISION_V245.type;
  var key=supervisionHomeKeyV245(type);
  var data=SUPERVISION_HOME_V245[key];
  var loading=!!SUPERVISION_LOADING_HOME_V245[key];
  var label=supervisionTypeLabelV245(type);
  var period=data&&data.periodLabel?data.periodLabel:periodLabel(selectedPeriod());
  var count=data?Number(data.count||0):0;
  var noun=type==='CAPSTONE'
    ?'group'+(count===1?'':'s')
    :'student'+(count===1?'':'s');
  var addLabel=type==='CAPSTONE'
    ?'+ Group'
    :(type==='MAGANG'?'+ Students':'+ Student');

  var body='';
  if(!data){
    body='<div class="placeholder" style="margin-top:18px">'+
      (loading?'Loading '+esc(label)+'…':'Open to load.')+
    '</div>';
  }else if(!(data.units||[]).length){
    body='<div class="placeholder" style="margin-top:18px">No active '+
      (type==='CAPSTONE'?'groups':'students')+
      '.</div>';
  }else if(type==='MAGANG'){
    body=renderMagangGroupsV245(data.units||[]);
  }else{
    body='<div class="supervisionGroupV245"><div class="supervisionUnitListV245">'+
      (data.units||[]).map(renderSupervisionUnitCardV245).join('')+
    '</div></div>';
  }

  return'<button class="btn compactBack" type="button" onclick="backFromSupervisionV245()">← Courses</button>'+
    '<div class="supervisionTopV245">'+
      '<div><h2>'+esc(label)+'</h2><div class="muted">'+
        esc(period)+' · '+count+' '+noun+
      '</div></div>'+
      '<div class="supervisionActionsV245">'+
        '<button class="btn" type="button" onclick="openAddSupervisionUnitV245()">'+addLabel+'</button>'+
      '</div>'+
    '</div>'+
    body+
    renderSupervisionEditFooterV247();
}

function renderMagangGroupsV245(units){
  var groups={};
  (units||[]).forEach(function(u){
    var c=String(u.Company||'').trim()||'Belum dikelompokkan';
    if(!groups[c])groups[c]=[];
    groups[c].push(u);
  });

  return Object.keys(groups).sort(function(a,b){
    return a.localeCompare(b);
  }).map(function(company){
    var rows=groups[company];
    return'<div class="supervisionGroupV245">'+
      '<div class="supervisionGroupHeadV245"><span>'+esc(company)+'</span>'+
        '<span class="muted">'+rows.length+' student'+(rows.length===1?'':'s')+'</span>'+
      '</div>'+
      '<div class="supervisionUnitListV245">'+
        rows.map(renderSupervisionUnitCardV245).join('')+
      '</div>'+
    '</div>';
  }).join('');
}

function supervisionMemberOriginalIndexV247(u,m){
  var all=Array.isArray(u.Members)?u.Members:[];
  var idx=all.findIndex(function(x){
    return String(x.NPM||'')===String(m.NPM||'') &&
      String(x.Name||'')===String(m.Name||'');
  });
  return idx;
}

function renderSupervisionUnitCardV245(u){
  var type=String(u.Type||'').toUpperCase();
  var meta=[];

  if(type==='CAPSTONE'){
    var members=Array.isArray(u.Members_Current)?u.Members_Current:(u.Members||[]);
    var names=members.map(function(m){return String(m.Name||'')}).filter(Boolean);
    if(names.length)meta.push(names.join(' · '));
    if(u.Topic)meta.push(u.Topic);
  }else{
    if(u.NPM)meta.push(u.NPM);
    if(type==='SKRIPSI'&&u.Topic)meta.push(u.Topic);
  }

  meta.push(Number(u.File_Count||0)+' file'+(Number(u.File_Count||0)===1?'':'s'));

  var continued=u.Continued
    ?'<div class="supervisionContinueV246">Continued from '+esc(u.Started_Period_Label||'previous period')+'</div>'
    :'';

  var card='<button class="supervisionUnitV245 '+(u._Pending?'supervisionPendingV245':'')+
    '" type="button" '+(u._Pending?'disabled ':'')+
    'onclick="openSupervisionUnitV245(\''+esc(u.Unit_ID)+'\')">'+
      '<div class="supervisionUnitTitleV245">'+esc(u.Name)+
        (u._Pending?' <span class="pendingSpinnerV204"></span>':'')+
      '</div>'+
      '<div class="supervisionUnitMetaV245">'+esc(meta.filter(Boolean).join(' · '))+'</div>'+
      continued+
      ((u.Last_Activity||'')
        ?'<div class="supervisionUnitActivityV245">Last activity · '+esc(u.Last_Activity)+'</div>'
        :'')+
    '</button>';

  if(!SUPERVISION_EDIT_MODE_V247||u._Pending){
    return card;
  }

  if(type!=='CAPSTONE'){
    return'<div class="supervisionUnitWrapV247">'+card+
      '<button class="mini supervisionPassBtnV247" type="button" '+
        (SUPERVISION_PASS_BUSY_V247[u.Unit_ID+'::-1']?'disabled ':'')+
        'onclick="markSupervisionPassedV247(\''+esc(u.Unit_ID)+'\',-1)">'+
        (SUPERVISION_PASS_BUSY_V247[u.Unit_ID+'::-1']?'Saving…':'☐ Lulus')+
      '</button>'+
    '</div>';
  }

  var active=Array.isArray(u.Members_Current)?u.Members_Current:[];
  var memberRows=active.map(function(m){
    var idx=supervisionMemberOriginalIndexV247(u,m);
    var busy=!!SUPERVISION_PASS_BUSY_V247[u.Unit_ID+'::'+idx];
    return'<div class="supervisionCapstoneEditMemberV247">'+
      '<span>'+esc((m.NPM?m.NPM+' · ':'')+m.Name)+'</span>'+
      '<button class="mini" type="button" '+(busy?'disabled ':'')+
        'onclick="markSupervisionPassedV247(\''+esc(u.Unit_ID)+'\','+idx+')">'+
        (busy?'Saving…':'☐ Lulus')+
      '</button>'+
    '</div>';
  }).join('');

  return'<div>'+card+
    (memberRows?'<div class="supervisionCapstoneEditMembersV247">'+memberRows+'</div>':'')+
  '</div>';
}

function renderSupervisionCapstoneMembersV246(u){
  var archive=!!(
    CURRENT_SUPERVISION_V245 &&
    CURRENT_SUPERVISION_V245.archive
  );

  var members=archive
    ?(Array.isArray(u.Members)?u.Members:[])
    :(Array.isArray(u.Members_Current)?u.Members_Current:(u.Members||[]));

  if(!members.length)return'';

  return'<div class="supervisionMembersListV246">'+members.map(function(m){
    var passed=String(m.Status||'').toUpperCase()==='PASSED';
    var idx=supervisionMemberOriginalIndexV247(u,m);
    var control=(!archive&&SUPERVISION_EDIT_MODE_V247&&!passed)
      ?'<button class="mini" type="button" '+
          (SUPERVISION_PASS_BUSY_V247[u.Unit_ID+'::'+idx]?'disabled ':'')+
          'onclick="markSupervisionPassedV247(\''+esc(u.Unit_ID)+'\','+idx+')">'+
          (SUPERVISION_PASS_BUSY_V247[u.Unit_ID+'::'+idx]?'Saving…':'☐ Lulus')+
        '</button>'
      :'';

    return'<div class="supervisionMemberRowV246">'+
      '<div class="supervisionMemberMainV246">'+
        esc((m.NPM?m.NPM+' · ':'')+m.Name)+
        (passed
          ?'<div class="supervisionMemberPassedV246">✓ Lulus'+
             (m.Passed_At_Text?' · '+esc(m.Passed_At_Text):'')+
           '</div>'
          :'')+
      '</div>'+
      control+
    '</div>';
  }).join('')+'</div>';
}

function renderSupervisionUnitDetailV245(){
  var unitId=CURRENT_SUPERVISION_V245.unitId;
  var packet=SUPERVISION_UNIT_V245[unitId];

  if(!packet){
    return'<button class="btn supervisionBackV245" type="button" onclick="backFromSupervisionV245()">← Back</button>'+
      '<div class="placeholder">'+
        (SUPERVISION_LOADING_UNIT_V245[unitId]?'Loading…':'Loading supervision…')+
      '</div>';
  }

  var u=packet.unit||{};
  var type=String(u.Type||'').toUpperCase();
  var archive=!!CURRENT_SUPERVISION_V245.archive;
  var sub=[];

  if(type==='MAGANG'){
    if(u.NPM)sub.push(u.NPM);
    if(u.Company)sub.push(u.Company);
  }
  if(type==='SKRIPSI'){
    if(u.NPM)sub.push(u.NPM);
    if(u.Topic)sub.push(u.Topic);
  }
  if(type==='CAPSTONE'&&u.Topic)sub.push(u.Topic);
  if(u.Started_Period_Label)sub.push('Started · '+u.Started_Period_Label);

  var members=type==='CAPSTONE'?renderSupervisionCapstoneMembersV246(u):'';
  var folder=u.Folder_URL
    ?'<a class="btn" href="'+esc(u.Folder_URL)+'" target="_blank" rel="noopener">📁 Folder</a>'
    :'<button class="btn" type="button" disabled>📁 Preparing…</button>';

// ------------------------- MAGANG BULK ADD -------------------------
function parseMagangBatchV247(text){
  var invalid=[];
  var rows=String(text||'').split(/\r?\n/).map(function(line,index){
    line=String(line||'').trim();
    if(!line)return null;

    var p=line.split('|').map(function(x){return String(x||'').trim()});
    if(p.length<2||!p[0]||!p[1]){
      invalid.push(index+1);
      return null;
    }

    return{
      Name:p[0],
      NPM:p[1].replace(/\s+/g,''),
      Company:p.slice(2).join(' | ').trim()
    };
  }).filter(Boolean);

  return{rows:rows,invalid:invalid};
}

function saveSupervisionMagangBatchV247(){
  if(!CURRENT_SUPERVISION_V245||CURRENT_SUPERVISION_V245.type!=='MAGANG')return;

  var parsed=parseMagangBatchV247(
    String((document.getElementById('supMagangBatchV247')||{}).value||'')
  );

  if(parsed.invalid.length){
    toast('Format invalid on line '+parsed.invalid.join(', ')+'. Use: Name | NPM | Company',true);
    return;
  }
  if(!parsed.rows.length){
    toast('Add at least one student.',true);
    return;
  }

  var b=document.getElementById('supMagangBatchBtnV247');
  if(b){b.disabled=true;b.textContent='Adding…'}

  var key=supervisionHomeKeyV245('MAGANG');
  if(!SUPERVISION_HOME_V245[key]){
    SUPERVISION_HOME_V245[key]={
      type:'MAGANG',
      periodId:SELECTED_PERIOD_ID,
      periodLabel:periodLabel(selectedPeriod()),
      count:0,
      units:[]
    };
  }

  var data=SUPERVISION_HOME_V245[key];
  var stamp=Date.now();
  var temps=parsed.rows.map(function(r,i){
    return{
      Unit_ID:'TMP-SVU-'+stamp+'-'+i,
      Period_ID:SELECTED_PERIOD_ID,
      Started_Period_ID:SELECTED_PERIOD_ID,
      Started_Period_Label:periodLabel(selectedPeriod()),
      Continued:false,
      Type:'MAGANG',
      Unit_Kind:'STUDENT',
      Name:r.Name,
      NPM:r.NPM,
      Company:r.Company,
      Topic:'',
      Members:[],
      Members_Current:[],
      Status:'ACTIVE',
      Folder_URL:'',
      File_Count:0,
      Last_Activity:'',
      _Pending:true
    };
  });

  data.units=(data.units||[]).concat(temps);
  data.count=data.units.length;
  closeModal();
  renderSupervisionV245();

  google.script.run
    .withSuccessHandler(function(r){

      renderSupervisionV245();

      var skipped=(r&&r.skipped||[]).length;

      data.count=data.units.length;

      failKeepUi(e);
    })

      SELECTED_PERIOD_ID,
      parsed.rows,
      ACCESS_KEY
    );

      SELECTED_PERIOD_ID,
      type,
      {Name:name,NPM:npm,Company:company,Topic:topic,Members:members},

    );
}

// ------------------------- PASS: EDIT MODE ONLY, HIDE IMMEDIATELY -------------------------
function markSupervisionPassedV247(unitId,memberIndex){
  if(!SUPERVISION_EDIT_MODE_V247)return;

  unitId=String(unitId||'');
  memberIndex=Number(memberIndex);
  var busyKey=unitId+'::'+memberIndex;
  if(SUPERVISION_PASS_BUSY_V247[busyKey])return;

  SUPERVISION_PASS_BUSY_V247[busyKey]=true;

  var home=supervisionCurrentHomeV245();
  var homeSnapshot=home?JSON.stringify(home):'';
  var packet=SUPERVISION_UNIT_V245[unitId];
  var packetSnapshot=packet?JSON.stringify(packet):'';

  // Optimistic removal from ACTIVE list.
  if(home){
    var u=(home.units||[]).find(function(x){return x.Unit_ID===unitId});
    if(u){
      if(String(u.Type||'').toUpperCase()==='CAPSTONE'){
        var all=Array.isArray(u.Members)?u.Members:[];
        var target=all[memberIndex];
        if(target){
          u.Members_Current=(u.Members_Current||[]).filter(function(m){
            return !(
              String(m.NPM||'')===String(target.NPM||'') &&
              String(m.Name||'')===String(target.Name||'')
            );
          });
          u.Active_Member_Count=(u.Members_Current||[]).length;
          if(!u.Active_Member_Count){
            home.units=(home.units||[]).filter(function(x){return x.Unit_ID!==unitId});
          }
        }
      }else{
        home.units=(home.units||[]).filter(function(x){return x.Unit_ID!==unitId});
      }
      home.count=(home.units||[]).length;
    }
  }

  if(packet&&packet.unit){
    var pu=packet.unit;
    if(String(pu.Type||'').toUpperCase()==='CAPSTONE'){
      var pall=Array.isArray(pu.Members)?pu.Members:[];
      var pt=pall[memberIndex];
      if(pt){
        pu.Members_Current=(pu.Members_Current||[]).filter(function(m){
          return !(
            String(m.NPM||'')===String(pt.NPM||'') &&
            String(m.Name||'')===String(pt.Name||'')
          );
        });
      }
    }
  }

  // If the individual student or entire group disappeared, return to overview.
  if(
    CURRENT_SUPERVISION_V245 &&
    CURRENT_SUPERVISION_V245.unitId===unitId &&
    packet &&
    packet.unit
  ){
    var ptype=String(packet.unit.Type||'').toUpperCase();
    var gone=ptype!=='CAPSTONE' || !(packet.unit.Members_Current||[]).length;
    if(gone){
      CURRENT_SUPERVISION_V245.unitId='';
      CURRENT_SUPERVISION_V245.archive=false;
    }
  }

  renderSupervisionV245();

  google.script.run
    .withSuccessHandler(function(){
      delete SUPERVISION_PASS_BUSY_V247[busyKey];
      delete SUPERVISION_UNIT_V245[unitId];

      var studentsKey=supervisionStudentsKeyV247(
        CURRENT_SUPERVISION_V245?CURRENT_SUPERVISION_V245.type:''
      );
      if(studentsKey)delete SUPERVISION_STUDENTS_V247[studentsKey];

      toast('Status lulus tersimpan.');

      // Reconcile quietly; active list stays hidden immediately.
      if(CURRENT_SUPERVISION_V245){
        setTimeout(function(){loadSupervisionHomeV245(true)},0);
        if(CURRENT_SUPERVISION_V245.unitId===unitId){
          setTimeout(function(){loadSupervisionUnitV245(unitId,true)},0);
        }
      }
    })
    .withFailureHandler(function(e){
      delete SUPERVISION_PASS_BUSY_V247[busyKey];

      if(home&&homeSnapshot){
        try{
          var restored=JSON.parse(homeSnapshot);
          SUPERVISION_HOME_V245[supervisionHomeKeyV245(CURRENT_SUPERVISION_V245.type)]=restored;
        }catch(ignore){}
      }
      if(packet&&packetSnapshot){
        try{SUPERVISION_UNIT_V245[unitId]=JSON.parse(packetSnapshot)}catch(ignore){}
      }

      renderSupervisionV245();
      failKeepUi(e);
    })
    .markSupervisionStudentPassedV246(
      unitId,
      memberIndex,
      ACCESS_KEY
    );
}

// ------------------------- FILE ICONS -------------------------
function supervisionFileIconV247(f){
  f=f||{};
  var url=String(f.URL||f.File_URL||'').toLowerCase();
  var title=String(f.Title||f.File_Title||'').toLowerCase();
  var type=String(f.File_Type||'').toUpperCase();

  if(
    /google\.[^/]+\/maps|maps\.google\.|goo\.gl\/maps|maps\.app\.goo\.gl/.test(url)
  )return'📍';
  if(type==='FOLDER'||/\/folders\//.test(url))return'📁';
  if(type==='SHEET'||/spreadsheets|\.xlsx?([?#]|$)|\.csv([?#]|$)/.test(url)||/\.(xlsx?|csv)$/.test(title))return'📊';
  if(type==='DOC'||/docs\.google\.com\/document|\.docx?([?#]|$)/.test(url)||/\.docx?$/.test(title))return'📝';
  if(type==='SLIDES'||/presentation|\.pptx?([?#]|$)/.test(url)||/\.pptx?$/.test(title))return'📽️';
  if(type==='PDF'||/\.pdf([?#]|$)/.test(url)||/\.pdf$/.test(title))return'📕';
  if(type==='VIDEO'||/youtube\.com|youtu\.be|\.mp4([?#]|$)/.test(url))return'🎥';
  if(/\.(png|jpe?g|webp|gif)([?#]|$)/.test(url)||/\.(png|jpe?g|webp|gif)$/.test(title))return'🖼️';
  if(/\.(zip|rar|7z)([?#]|$)/.test(url)||/\.(zip|rar|7z)$/.test(title))return'📦';
  if(type==='LINK')return'🔗';
  return'📄';
}

          '<a href="'+esc(f.URL)+'" target="_blank" rel="noopener">'+

          '</a>'+
        '</div>'+

      '</div>'+

function renderSupervisionLogV245(logs){
  if(!(logs||[]).length)return'<div class="placeholder">No activity yet.</div>';

  return'<div class="supervisionLogV245">'+logs.map(function(l){
    var isFile=String(l.Type||'').toUpperCase()==='FILE';
    var icon=isFile?supervisionFileIconV247({
      URL:l.File_URL||'',
      Title:l.File_Title||'',
      File_Type:''
    }):'';
    var body=isFile
      ?('<a href="'+esc(l.File_URL||'#')+'" target="_blank" rel="noopener">'+
          '<span class="supervisionFileIconV247">'+icon+'</span>'+
          esc(l.File_Title||'File')+
        '</a>')
      :esc(l.Text||'');

    return'<div class="supervisionLogItemV245 '+(l._Pending?'supervisionPendingV245':'')+'">'+
      '<span class="supervisionLogTypeV245">'+(isFile?'FILE':'NOTE')+'</span>'+
      '<div class="supervisionLogTextV245">'+body+'</div>'+
      '<div class="supervisionDateV245">'+esc(l.Date||'')+'</div>'+
    '</div>';
  }).join('')+'</div>';
}

<script id="v248-supervision-fast-timeline-runtime">
// =============================================================================
// V248 — final overrides for Supervision only.
// =============================================================================
var SUP_ACTIVE_COUNTS_V248={};
var SUP_ACTIVE_COUNTS_PERIOD_V248='';
var SUP_EDIT_V248={active:false,type:'',draft:null,snapshot:null,saving:false,armed:{}};
var SUP_TIMELINE_V248={};
var SUP_TIMELINE_LOADING_V248={};
var SUP_LOG_V248={};
var SUP_LOG_LOADING_V248={};
var SUP_LOG_OPEN_V248={};
var SUP_FILE_MODE_V248='upload';
var SUP_UNIT_META_LOADING_V248={};

function deepCloneV248(x){return JSON.parse(JSON.stringify(x==null?null:x))}
function supHomeV248(){return supervisionCurrentHomeV245()}

function supActiveCountFromHomeV248(data,type){
  if(!data)return null;
  if(type==='CAPSTONE'){
    return(data.units||[]).reduce(function(sum,u){
      return sum+Number(u.Active_Member_Count||(u.Members_Current||[]).length||0)
    },0)
  }
  return(data.units||[]).length
}

function touchSupCountV248(type,count){
  if(SUP_ACTIVE_COUNTS_PERIOD_V248!==SELECTED_PERIOD_ID)return;
  SUP_ACTIVE_COUNTS_V248[type]=Math.max(0,Number(count||0));
  renderCourseList()
}

// ------------------------- LEFT LIST: "-" FIRST, COUNT LATER -------------------------
renderCourseList=function(){
  var host=document.getElementById('courseList');
  if(!host)return;

  var old=host.scrollTop;
  var q=String(SEARCH||'').trim().toLowerCase();

  var regular=(HOME&&HOME.teachings||[]).filter(function(t){
    return!q||[
      t.Course_Name,
      t.Course_Code,
      (t.Classes||[]).join(' ')
    ].join(' ').toLowerCase().indexOf(q)>=0
  });

  var supervision=SELECTED_PERIOD_ID
    ?SUPERVISION_TYPES_V245.filter(function(x){
      return!q||[x.Label,'supervision','bimbingan'].join(' ').toLowerCase().indexOf(q)>=0
    })
    :[];

  document.getElementById('courseCount').textContent=
    regular.length+' course'+(regular.length===1?'':'s');

  var items=[];

  regular.forEach(function(t){
    items.push({
      kind:'course',
      edited:courseLastEditedMsV247(t),
      name:String(t.Course_Name||''),
      teaching:t
    })
  });

  supervision.forEach(function(x){
    items.push({
      kind:'supervision',
      edited:Number(SUPERVISION_RECENCY_V247[x.Type]||0),
      name:String(x.Label||''),
      supervision:x
    })
  });

  items.sort(function(a,b){
    var d=Number(b.edited||0)-Number(a.edited||0);
    return d||String(a.name||'').localeCompare(String(b.name||''))
  });

  host.innerHTML=items.length?items.map(function(item){
    if(item.kind==='supervision'){
      var x=item.supervision;
      var active=CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===x.Type;
      var known=SUP_ACTIVE_COUNTS_PERIOD_V248===SELECTED_PERIOD_ID &&
        Object.prototype.hasOwnProperty.call(SUP_ACTIVE_COUNTS_V248,x.Type);
      var meta=known
        ?Number(SUP_ACTIVE_COUNTS_V248[x.Type]||0)+' students active'
        :'-';

      return'<button class="courseCard supervisionCardV245 '+(active?'active':'')+
        '" type="button" onclick="openSupervisionV245(\''+x.Type+'\')">'+
          '<div class="courseTitle">'+esc(x.Label)+'</div>'+
          '<div class="courseMeta">'+esc(meta)+'</div>'+
        '</button>'
    }

    var t=item.teaching,a=ACTIVITY_SUMMARY[t.Teaching_ID]||{},activity=[];
    if(Number(a.openTasks||0))activity.push(a.openTasks+' task'+(Number(a.openTasks)===1?'':'s'));
    if(a.nextAssignment)activity.push('Next: '+a.nextAssignment.Title);

    return'<button class="courseCard '+(CURRENT_TEACHING_ID===t.Teaching_ID?'active':'')+
      '" type="button" onclick="openTeaching(\''+esc(t.Teaching_ID)+'\')">'+
        '<div class="courseTitle">'+esc(t.Course_Name)+(t.pending?' <span class="pendingText">⏳</span>':'')+'</div>'+
        '<div class="courseMeta">'+esc(classesText(t.Classes))+'</div>'+
        (activity.length?'<div class="courseActivity">'+esc(activity.join(' · '))+'</div>':'')+
      '</button>'
  }).join(''):'<div class="muted">No courses in this period.</div>';

  host.scrollTop=old
};

function loadActivitySummary(){
  if(!SELECTED_PERIOD_ID)return;
  setTimeout(loadHomeTasksV202,0);

  var requestedPeriod=SELECTED_PERIOD_ID;
  google.script.run
    .withSuccessHandler(function(r){
      if(requestedPeriod!==SELECTED_PERIOD_ID)return;
      ACTIVITY_SUMMARY=r&&r.summary||{};
      SUPERVISION_RECENCY_V247=r&&r.supervisionRecency||{MAGANG:0,CAPSTONE:0,SKRIPSI:0};
      SUP_ACTIVE_COUNTS_V248=r&&r.supervisionActiveCounts||{};
      SUP_ACTIVE_COUNTS_PERIOD_V248=requestedPeriod;
      renderCourseList();

      if(!CURRENT_TEACHING_ID&&!CURRENT_SUPERVISION_V245){
        renderHome(document.body.classList.contains('homeOpen'))
      }
    })
    .withFailureHandler(function(){})
    .getCoursesPeriodActivitySummaryV248(requestedPeriod,ACCESS_KEY)
}

var changePeriodBeforeV248=changePeriod;
changePeriod=function(id){
  SUP_ACTIVE_COUNTS_V248={};
  SUP_ACTIVE_COUNTS_PERIOD_V248='';
  resetSupervisionEditV248();
  return changePeriodBeforeV248(id)
};

// ------------------------- FAST OVERVIEW -------------------------
function loadSupervisionHomeV245(force){
  if(!CURRENT_SUPERVISION_V245||!SELECTED_PERIOD_ID)return;
  var type=CURRENT_SUPERVISION_V245.type,key=supervisionHomeKeyV245(type);

  if(!force&&SUPERVISION_HOME_V245[key]){
    renderSupervisionV245();
    return
  }
  if(SUPERVISION_LOADING_HOME_V245[key])return;

  SUPERVISION_LOADING_HOME_V245[key]=true;
  renderSupervisionV245();

  google.script.run
    .withSuccessHandler(function(r){
      SUPERVISION_LOADING_HOME_V245[key]=false;
      SUPERVISION_HOME_V245[key]=r||{type:type,periodId:SELECTED_PERIOD_ID,count:0,activeStudents:0,units:[]};

      if(SUP_ACTIVE_COUNTS_PERIOD_V248===SELECTED_PERIOD_ID){
        SUP_ACTIVE_COUNTS_V248[type]=Number(r&&r.activeStudents||0)
      }

      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===type){
        renderSupervisionV245();
        renderCourseList()
      }
    })
    .withFailureHandler(function(e){
      SUPERVISION_LOADING_HOME_V245[key]=false;
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.type===type)renderSupervisionV245();
      failKeepUi(e)
    })
    .getSupervisionHomeV248(SELECTED_PERIOD_ID,type,ACCESS_KEY)
}

// ------------------------- FAST DETAIL + LAZY TIMELINE / LOG -------------------------
function findSupUnitInHomeV248(unitId){
  var h=supHomeV248();
  return h&&(h.units||[]).find(function(u){return String(u.Unit_ID)===String(unitId)})||null
}

function openSupervisionUnitV245(unitId){
  if(!CURRENT_SUPERVISION_V245)return;
  unitId=String(unitId||'');
  CURRENT_SUPERVISION_V245.unitId=unitId;
  CURRENT_SUPERVISION_V245.archive=false;
  CURRENT_SUPERVISION_V245.fromStudents=false;

  var cached=findSupUnitInHomeV248(unitId);
  if(cached)SUPERVISION_UNIT_V245[unitId]={ok:true,unit:deepCloneV248(cached)};

  renderSupervisionV245();

  if(!cached)loadSupervisionUnitV245(unitId,true);
  setTimeout(function(){loadSupervisionTimelineV248(unitId,false)},0);

  if(cached&&!cached.Folder_URL){
    setTimeout(function(){ensureSupervisionFolderBackgroundV245(unitId)},700)
  }
}

function loadSupervisionUnitV245(unitId,force){
  unitId=String(unitId||'');
  if(!unitId)return;

  var archive=!!(
    CURRENT_SUPERVISION_V245&&
    CURRENT_SUPERVISION_V245.archive&&
    CURRENT_SUPERVISION_V245.unitId===unitId
  );

  if(!force&&SUPERVISION_UNIT_V245[unitId]){
    renderSupervisionV245();
    setTimeout(function(){loadSupervisionTimelineV248(unitId,false)},0);
    return
  }
  if(SUP_UNIT_META_LOADING_V248[unitId])return;

  SUP_UNIT_META_LOADING_V248[unitId]=true;
  renderSupervisionV245();

  google.script.run
    .withSuccessHandler(function(r){
      SUP_UNIT_META_LOADING_V248[unitId]=false;
      SUPERVISION_UNIT_V245[unitId]=r||null;
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId){
        renderSupervisionV245();
        setTimeout(function(){loadSupervisionTimelineV248(unitId,false)},0)
      }
      if(!archive&&r&&r.unit&&!r.unit.Folder_URL){
        setTimeout(function(){ensureSupervisionFolderBackgroundV245(unitId)},700)
      }
    })
    .withFailureHandler(function(e){
      SUP_UNIT_META_LOADING_V248[unitId]=false;
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();
      failKeepUi(e)
    })
    .getSupervisionUnitMetaV248(unitId,SELECTED_PERIOD_ID,archive,ACCESS_KEY)
}

function loadSupervisionTimelineV248(unitId,force){
  unitId=String(unitId||'');
  if(!unitId)return;
  if(!force&&SUP_TIMELINE_V248[unitId]!==undefined){
    if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();
    return
  }
  if(SUP_TIMELINE_LOADING_V248[unitId])return;

  SUP_TIMELINE_LOADING_V248[unitId]=true;
  if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();

  google.script.run
    .withSuccessHandler(function(r){
      SUP_TIMELINE_LOADING_V248[unitId]=false;
      SUP_TIMELINE_V248[unitId]=r&&r.items||[];
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245()
    })
    .withFailureHandler(function(e){
      SUP_TIMELINE_LOADING_V248[unitId]=false;
      if(SUP_TIMELINE_V248[unitId]===undefined)SUP_TIMELINE_V248[unitId]=[];
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();
      toast(errText(e),true)
    })
    .getSupervisionTimelineV248(unitId,ACCESS_KEY)
}

function toggleSupervisionLogV248(unitId){
  unitId=String(unitId||'');
  SUP_LOG_OPEN_V248[unitId]=!SUP_LOG_OPEN_V248[unitId];
  renderSupervisionV245();
  if(SUP_LOG_OPEN_V248[unitId])loadSupervisionLogV248(unitId,false)
}

function loadSupervisionLogV248(unitId,force){
  unitId=String(unitId||'');
  if(!unitId)return;
  if(!force&&SUP_LOG_V248[unitId]!==undefined){
    renderSupervisionV245();
    return
  }
  if(SUP_LOG_LOADING_V248[unitId])return;

  SUP_LOG_LOADING_V248[unitId]=true;
  renderSupervisionV245();

  google.script.run
    .withSuccessHandler(function(r){
      SUP_LOG_LOADING_V248[unitId]=false;
      SUP_LOG_V248[unitId]=r&&r.logs||[];
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245()
    })
    .withFailureHandler(function(e){
      SUP_LOG_LOADING_V248[unitId]=false;
      renderSupervisionV245();
      toast(errText(e),true)
    })
    .getSupervisionEditLogV248(unitId,ACCESS_KEY)
}

// ------------------------- EDIT MODE: STAGED UNTIL SAVE -------------------------
function resetSupervisionEditV248(){
  SUP_EDIT_V248={active:false,type:'',draft:null,snapshot:null,saving:false,armed:{}}
}

function startSupervisionEditModeV248(){
  if(!CURRENT_SUPERVISION_V245)return;
  var h=supHomeV248();
  if(!h){
    loadSupervisionHomeV245(true);
    return
  }

  SUP_EDIT_V248={
    active:true,
    type:CURRENT_SUPERVISION_V245.type,
    draft:deepCloneV248(h),
    snapshot:deepCloneV248(h),
    saving:false,
    armed:{}
  };

  CURRENT_SUPERVISION_V245.unitId='';
  CURRENT_SUPERVISION_V245.archive=false;
  SUPERVISION_STUDENTS_VIEW_V247=false;
  renderSupervisionV245()
}

function cancelSupervisionEditV248(){
  resetSupervisionEditV248();
  SUPERVISION_STUDENTS_VIEW_V247=false;
  if(CURRENT_SUPERVISION_V245)CURRENT_SUPERVISION_V245.unitId='';
  renderSupervisionV245()
}

function supDraftUnitV248(unitId){
  var d=SUP_EDIT_V248.draft;
  return d&&(d.units||[]).find(function(u){return String(u.Unit_ID)===String(unitId)})||null
}

function editSupFieldV248(unitId,field,value){
  var u=supDraftUnitV248(unitId);if(!u)return;
  u[field]=String(value==null?'':value)
}

function editSupMemberFieldV248(unitId,index,field,value){
  var u=supDraftUnitV248(unitId);if(!u)return;
  var members=u.Members||[];
  if(!members[index])return;
  members[index][field]=String(value==null?'':value)
}

function stageSupPassV248(unitId,memberIndex){
  var u=supDraftUnitV248(unitId);if(!u)return;

  if(String(u.Type).toUpperCase()==='CAPSTONE'){
    var m=(u.Members||[])[Number(memberIndex)];
    if(!m)return;
    m.Status='PASSED'
  }else{
    u.Status='PASSED'
  }
  renderSupervisionV245()
}

function armSupDeleteV248(key,commit){
  if(!SUP_EDIT_V248.armed[key]){
    SUP_EDIT_V248.armed[key]=true;
    renderSupervisionV245();
    return false
  }
  delete SUP_EDIT_V248.armed[key];
  commit();
  renderSupervisionV245();
  return true
}

function stageSupDeleteStudentV248(unitId){
  armSupDeleteV248('UNIT::'+unitId,function(){
    var u=supDraftUnitV248(unitId);if(u)u.Delete=true
  })
}

function stageSupDeleteGroupV248(unitId){
  armSupDeleteV248('GROUP::'+unitId,function(){
    var u=supDraftUnitV248(unitId);if(u)u.Delete=true
  })
}

function stageSupDeleteMemberV248(unitId,index){
  armSupDeleteV248('MEMBER::'+unitId+'::'+index,function(){
    var u=supDraftUnitV248(unitId);if(!u)return;
    var m=(u.Members||[])[Number(index)];if(m)m.Status='DELETED'
  })
}

function stageSupDeleteCompanyV248(company){
  var key='COMPANY::'+String(company||'');
  armSupDeleteV248(key,function(){
    (SUP_EDIT_V248.draft&&SUP_EDIT_V248.draft.units||[]).forEach(function(u){
      if(
        String(u.Type||'').toUpperCase()==='MAGANG'&&
        String(u.Company||'')===String(company||'')&&
        String(u.Status||'').toUpperCase()==='ACTIVE'
      )u.Delete=true
    })
  })
}

function serializeSupEditUnitsV248(){
  return(SUP_EDIT_V248.draft&&SUP_EDIT_V248.draft.units||[]).map(function(u){
    return{
      Unit_ID:u.Unit_ID,
      Name:u.Name||'',
      NPM:u.NPM||'',
      Company:u.Company||'',
      Topic:u.Topic||'',
      Status:u.Status||'ACTIVE',
      Delete:u.Delete===true,
      Members:(u.Members||[]).map(function(m){
        return{
          NPM:m.NPM||'',
          Name:m.Name||'',
          Status:m.Status||'ACTIVE',
          Passed_At:m.Passed_At||''
        }
      })
    }
  })
}

function saveFinishSupervisionEditV248(){
  if(!SUP_EDIT_V248.active||SUP_EDIT_V248.saving)return;

  var type=SUP_EDIT_V248.type;
  SUP_EDIT_V248.saving=true;
  renderSupervisionV245();

  google.script.run
    .withSuccessHandler(function(){
      SUP_EDIT_V248.saving=false;
      resetSupervisionEditV248();

      delete SUPERVISION_HOME_V245[supervisionHomeKeyV245(type)];
      Object.keys(SUPERVISION_UNIT_V245).forEach(function(k){delete SUPERVISION_UNIT_V245[k]});
      Object.keys(SUP_TIMELINE_V248).forEach(function(k){delete SUP_TIMELINE_V248[k]});
      Object.keys(SUP_LOG_V248).forEach(function(k){delete SUP_LOG_V248[k]});
      delete SUPERVISION_STUDENTS_V247[supervisionStudentsKeyV247(type)];

      SUPERVISION_RECENCY_V247[type]=Date.now();
      SUP_ACTIVE_COUNTS_PERIOD_V248='';
      SUP_ACTIVE_COUNTS_V248={};

      toast('Changes saved.');
      loadSupervisionHomeV245(true);
      setTimeout(loadActivitySummary,0)
    })
    .withFailureHandler(function(e){
      SUP_EDIT_V248.saving=false;
      renderSupervisionV245();
      failKeepUi(e)
    })
    .saveSupervisionEditsV248(
      type,
      {units:serializeSupEditUnitsV248()},
      ACCESS_KEY
    )
}

// Compatibility names from V247 now use V248 behavior.
function startSupervisionEditModeV247(){startSupervisionEditModeV248()}
function finishSupervisionEditModeV247(){saveFinishSupervisionEditV248()}
function markSupervisionPassedV247(unitId,memberIndex){
  if(!SUP_EDIT_V248.active)return;
  stageSupPassV248(unitId,memberIndex)
}
function markSupervisionPassedV246(unitId,memberIndex){
  return markSupervisionPassedV247(unitId,memberIndex)
}

function renderSupEditDeleteButtonV248(key,onclick,label){
  var armed=!!SUP_EDIT_V248.armed[key];
  return'<button class="mini danger '+(armed?'supDeleteArmedV248':'')+
    '" type="button" onclick="'+onclick+'">'+
    (armed?'Yes, delete':(label||'Delete'))+
  '</button>'
}

function renderSupEditOverviewV248(){
  var d=SUP_EDIT_V248.draft||{units:[]};
  var type=SUP_EDIT_V248.type;
  var units=(d.units||[]).filter(function(u){
    if(u.Delete)return false;
    if(type==='CAPSTONE'){
      return(u.Members||[]).some(function(m){
        return String(m.Status||'').toUpperCase()==='ACTIVE'
      })
    }
    return String(u.Status||'').toUpperCase()==='ACTIVE'
  });

  var body='';

  if(type==='MAGANG'){
    var groups={};
    units.forEach(function(u){
      var c=String(u.Company||'').trim()||'Belum dikelompokkan';
      if(!groups[c])groups[c]=[];
      groups[c].push(u)
    });

    body=Object.keys(groups).sort(function(a,b){return a.localeCompare(b)}).map(function(company){
      return'<div class="supEditGroupV248">'+
        '<div class="supEditGroupHeadV248"><div class="supEditGroupTitleV248">'+esc(company)+'</div>'+
          renderSupEditDeleteButtonV248(
            'COMPANY::'+company,
            'stageSupDeleteCompanyV248('+JSON.stringify(company)+')',
            'Delete company'
          )+
        '</div>'+
        groups[company].map(function(u){
          return'<div class="supEditRowV248">'+

function renderSupervisionUnitCardV248(u){
  var type=String(u.Type||'').toUpperCase(),meta=[];
  if(type==='CAPSTONE'){
    var members=Array.isArray(u.Members_Current)?u.Members_Current:(u.Members||[]);
    var names=members.map(function(m){return String(m.Name||'')}).filter(Boolean);
    if(names.length)meta.push(names.join(' · '));
    if(u.Topic)meta.push(u.Topic)

  var continued=u.Continued
    ?'<div class="supervisionContinueV246">Continued from '+esc(u.Started_Period_Label||'previous period')+'</div>'

    '<div class="supervisionUnitMetaV245">'+esc(meta.filter(Boolean).join(' · '))+'</div>'+
    continued+

}

function renderSupervisionTimelineV248(items){
  items=(items||[]).slice().sort(function(a,b){return Number(a.Date_MS||0)-Number(b.Date_MS||0)});
  if(!items.length)return'<div class="placeholder">No notes or files yet.</div>';

  var rows=[];
  for(var i=0;i<items.length;i+=3)rows.push(items.slice(i,i+3));

  return'<div class="supSnakeV248">'+rows.map(function(row,rowIndex){
    var reverse=rowIndex%2===1;
    var cards=row.map(function(l,j){
      var no=rowIndex*3+j+1;
      var isFile=String(l.Type||'').toUpperCase()==='FILE';
      return'<div class="supSnakeItemV248">'+
        '<div class="supSnakeNoV248">'+no+'</div>'+
        '<div class="supSnakeDateV248">'+esc(l.Date||'')+'</div>'+
        '<div class="supSnakeKindV248">'+(isFile?'FILE':'NOTE')+'</div>'+
        '<div class="supSnakeTextV248">'+(isFile?timelineFileBodyV248(l):esc(l.Text||''))+'</div>'+
      '</div>'
    }).join('');

    var turn=rowIndex<rows.length-1
      ?'<div class="supSnakeTurnV248 '+(reverse?'left':'right')+'"></div>'
      :'';

    return'<div class="supSnakeRowV248 '+(reverse?'reverse':'')+'">'+cards+'</div>'+turn
  }).join('')+'</div>'
}

}

// ------------------------- BACK NAV + EDIT MODE -------------------------
function backFromSupervisionV245(){
  if(!CURRENT_SUPERVISION_V245)return;

  if(CURRENT_SUPERVISION_V245.unitId){
    var fromStudents=!!CURRENT_SUPERVISION_V245.fromStudents;
    CURRENT_SUPERVISION_V245.unitId='';
    CURRENT_SUPERVISION_V245.archive=false;
    CURRENT_SUPERVISION_V245.fromStudents=false;

    if(fromStudents){
      SUPERVISION_STUDENTS_VIEW_V247=true;
      renderSupervisionV245();
      return
    }

    renderSupervisionV245();
    return
  }

  if(SUPERVISION_STUDENTS_VIEW_V247){
    SUPERVISION_STUDENTS_VIEW_V247=false;
    renderSupervisionV245();
    return
  }

  if(SUP_EDIT_V248.active){
    cancelSupervisionEditV248();
    return
  }

  CURRENT_SUPERVISION_V245=null;
  document.body.classList.remove('detailOpen','homeOpen');
  renderCourseList();
  if(!compact())renderHome(false)
}

// ------------------------- NOTE: OPTIMISTIC TIMELINE -------------------------
function saveSupervisionNoteV245(){
  var unitId=CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId;
  var text=String((document.getElementById('supNoteV245')||{}).value||'').trim();
  if(!unitId||!text){toast('Note is required.',true);return}

  if(!Array.isArray(SUP_TIMELINE_V248[unitId]))SUP_TIMELINE_V248[unitId]=[];

  var tempId='TMP-LOG-'+Date.now();
  var temp={
    Log_ID:tempId,
    Unit_ID:unitId,
    Type:'NOTE',
    Text:text,
    File_ID:'',
    File_Title:'',
    File_URL:'',
    Date:new Date().toLocaleString(),
    Date_MS:Date.now(),
    _Pending:true
  };

  SUP_TIMELINE_V248[unitId].push(temp);
  closeModal();
  renderSupervisionV245();

  var type=CURRENT_SUPERVISION_V245.type;
  SUPERVISION_RECENCY_V247[type]=Date.now();

  google.script.run
    .withSuccessHandler(function(r){
      var rows=SUP_TIMELINE_V248[unitId]||[];
      var i=rows.findIndex(function(x){return x.Log_ID===tempId});
      if(i>=0)rows[i]=r.log;

      if(Array.isArray(SUP_LOG_V248[unitId]))SUP_LOG_V248[unitId].unshift(r.log);
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();
      renderCourseList()
    })
    .withFailureHandler(function(e){
      SUP_TIMELINE_V248[unitId]=(SUP_TIMELINE_V248[unitId]||[]).filter(function(x){return x.Log_ID!==tempId});
      renderSupervisionV245();
      failKeepUi(e)
    })
    .addSupervisionNoteV245(unitId,text,ACCESS_KEY)
}

function clientFileTypeV248(name,mime){
  var n=String(name||'').toLowerCase(),m=String(mime||'').toLowerCase();
  if(m==='application/pdf'||/\.pdf$/.test(n))return'PDF';
  if(/spreadsheet|excel|csv/.test(m)||/\.(xlsx?|csv)$/.test(n))return'SHEET';
  if(/word|document/.test(m)||/\.(docx?|odt)$/.test(n))return'DOC';
  if(/presentation|powerpoint/.test(m)||/\.(pptx?|odp)$/.test(n))return'SLIDES';
  if(/^image\//.test(m)||/\.(png|jpe?g|webp|gif)$/.test(n))return'IMAGE';
  if(/^video\//.test(m)||/\.(mp4|mov|mkv|avi)$/.test(n))return'VIDEO';
  if(/zip|rar|7z/.test(m)||/\.(zip|rar|7z)$/.test(n))return'ARCHIVE';
  return'FILE'
}

function addTempFileTimelineV248(unitId,title,url,fileType){
  if(!Array.isArray(SUP_TIMELINE_V248[unitId]))SUP_TIMELINE_V248[unitId]=[];
  var id='TMP-FILE-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
  SUP_TIMELINE_V248[unitId].push({
    Log_ID:id,
    Unit_ID:unitId,
    Type:'FILE',
    Text:'',
    File_ID:'',
    File_Title:title,
    File_URL:url||'#',
    File_Type:fileType||'FILE',
    Date:new Date().toLocaleString(),
    Date_MS:Date.now(),
    _Pending:true
  });
  return id
}

function replaceTempTimelineV248(unitId,tempId,realLog){
  var rows=SUP_TIMELINE_V248[unitId]||[];
  var idx=rows.findIndex(function(x){return x.Log_ID===tempId});
  if(idx>=0)rows[idx]=realLog;
  if(Array.isArray(SUP_LOG_V248[unitId]))SUP_LOG_V248[unitId].unshift(realLog)
}

function removeTempTimelineV248(unitId,tempId){
  SUP_TIMELINE_V248[unitId]=(SUP_TIMELINE_V248[unitId]||[]).filter(function(x){return x.Log_ID!==tempId})
}

function saveSupervisionFileV248(){
  var unitId=CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId;
  if(!unitId)return;

  var b=document.getElementById('supFileSaveV248');
  if(b){b.disabled=true;b.textContent='Adding…'}

  if(SUP_FILE_MODE_V248==='link'){
    saveSupervisionLinkV248(unitId,b);
    return
  }

  var input=document.getElementById('supUploadFileV248');
  var file=input&&input.files&&input.files[0];
  if(!file){
    if(b){b.disabled=false;b.textContent='Add File'}
    toast('Choose a file to upload.',true);
    return
  }
  if(file.size>20*1024*1024){
    if(b){b.disabled=false;b.textContent='Add File'}
    toast('Maximum upload size is 20 MB.',true);
    return
  }

  var title=String((document.getElementById('supUploadTitleV248')||{}).value||'').trim()||file.name;
  var reader=new FileReader();

  reader.onload=function(){
    var raw=String(reader.result||'');
    var base64=raw.indexOf(',')>=0?raw.slice(raw.indexOf(',')+1):raw;
    var tempId=addTempFileTimelineV248(unitId,title,'#',clientFileTypeV248(file.name,file.type));
    closeModal();
    renderSupervisionV245();

    var type=CURRENT_SUPERVISION_V245.type;
    SUPERVISION_RECENCY_V247[type]=Date.now();

    google.script.run
      .withSuccessHandler(function(r){
        replaceTempTimelineV248(unitId,tempId,r.log);
        var packet=SUPERVISION_UNIT_V245[unitId];
        if(packet&&packet.unit&&r.Folder_URL){
          packet.unit.Folder_URL=r.Folder_URL;
          packet.unit.Folder_ID=r.Folder_ID||packet.unit.Folder_ID
        }
        if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();
        renderCourseList();
        toast('File uploaded.')
      })
      .withFailureHandler(function(e){
        removeTempTimelineV248(unitId,tempId);
        renderSupervisionV245();
        failKeepUi(e)
      })
      .uploadSupervisionFileV248(
        unitId,
        title,
        file.name,
        file.type||'application/octet-stream',
        base64,
        ACCESS_KEY
      )
  };

  reader.onerror=function(){
    if(b){b.disabled=false;b.textContent='Add File'}
    toast('Could not read the selected file.',true)
  };

  reader.readAsDataURL(file)
}

function saveSupervisionLinkV248(unitId,b){
  var title=String((document.getElementById('supLinkTitleV248')||{}).value||'').trim();
  var url=String((document.getElementById('supLinkUrlV248')||{}).value||'').trim();
  var move=!!((document.getElementById('supMoveToFolderV248')||{}).checked);

  if(!title||!/^https?:\/\//i.test(url)){
    if(b){b.disabled=false;b.textContent='Add File'}
    toast('Title and a valid link are required.',true);
    return
  }

  var tempId=addTempFileTimelineV248(unitId,title,url,'LINK');
  closeModal();
  renderSupervisionV245();

  var type=CURRENT_SUPERVISION_V245.type;
  SUPERVISION_RECENCY_V247[type]=Date.now();

  google.script.run
    .withSuccessHandler(function(r){
      replaceTempTimelineV248(unitId,tempId,r.log);
      if(CURRENT_SUPERVISION_V245&&CURRENT_SUPERVISION_V245.unitId===unitId)renderSupervisionV245();
      renderCourseList();
      toast('Link added.');

      if(r&&r.file&&r.file.Drive_ID){
        google.script.run
          .withSuccessHandler(function(x){
            if(x&&x.error)toast('Link saved · Drive placement issue: '+x.error,true)
          })
          .withFailureHandler(function(e){toast('Link saved · '+errText(e),true)})
          .syncSupervisionDrivePlacementV248(
            r.file.File_ID,
            move,
            ACCESS_KEY
          )
      }
    })
    .withFailureHandler(function(e){
      removeTempTimelineV248(unitId,tempId);
      renderSupervisionV245();
      failKeepUi(e)
    })
    .addSupervisionLinkV248(unitId,title,url,ACCESS_KEY)
}

function supervisionFileIconV247(f){

  if(type==='DOC'||/docs\.google\.com\/document|\.docx?([?#]|$)/.test(url)||/\.docx?$/.test(title))return'📝';
  if(type==='SLIDES'||/presentation|\.pptx?([?#]|$)/.test(url)||/\.pptx?$/.test(title))return'📽️';
  if(type==='PDF'||/\.pdf([?#]|$)/.test(url)||/\.pdf$/.test(title))return'📕';
  if(type==='VIDEO'||/youtube\.com|youtu\.be|\.mp4([?#]|$)/.test(url))return'🎥';

  if(type==='ARCHIVE'||/\.(zip|rar|7z)([?#]|$)/.test(url)||/\.(zip|rar|7z)$/.test(title))return'📦';

<script id="v249-supervision-content-edit-runtime">
// =============================================================================
// V249 — Edit Mode is contextual:
// - from supervision list -> edit students/groups (V248)
// - from inside student/group -> edit notes/files for that unit (V249)
// =============================================================================
var SUP_CONTENT_EDIT_V249={
  active:false,
  unitId:'',
  draft:null,
  snapshot:null,
  saving:false,
  loading:false,
  armed:{},
  waitTimer:0
};

function resetSupervisionContentEditV249(){
  if(SUP_CONTENT_EDIT_V249.waitTimer)clearTimeout(SUP_CONTENT_EDIT_V249.waitTimer);
  SUP_CONTENT_EDIT_V249={
    active:false,
    unitId:'',
    draft:null,
    snapshot:null,
    saving:false,
    loading:false,
    armed:{},
    waitTimer:0
  }
}

function supervisionTimelineDraftV249(unitId){
  var src=SUP_TIMELINE_V248[unitId];
  if(!Array.isArray(src))return null;

  return src
    .filter(function(x){
      var t=String(x.Type||'').toUpperCase();
      return t==='NOTE'||t==='FILE'
    })
    .map(function(x){
      return{
        Log_ID:x.Log_ID||'',
        Unit_ID:unitId,
        Type:String(x.Type||'').toUpperCase(),
        Text:x.Text||'',
        File_ID:x.File_ID||'',
        File_Title:x.File_Title||'',
        File_URL:x.File_URL||'',
        File_Type:x.File_Type||'',
        Date:x.Date||'',
        Date_MS:Number(x.Date_MS||0),
        Delete:false
      }
    })
}

function initializeSupervisionContentDraftV249(unitId){
  var draft=supervisionTimelineDraftV249(unitId);
  if(!draft)return false;

  SUP_CONTENT_EDIT_V249.loading=false;
  SUP_CONTENT_EDIT_V249.draft=draft;
  SUP_CONTENT_EDIT_V249.snapshot=deepCloneV248(draft);
  renderSupervisionV245();
  return true
}

function waitForSupervisionTimelineV249(unitId,attempt){
  if(
    !SUP_CONTENT_EDIT_V249.active ||
    SUP_CONTENT_EDIT_V249.unitId!==unitId
  )return;

  if(initializeSupervisionContentDraftV249(unitId))return;

  if(Number(attempt||0)>=80){
    SUP_CONTENT_EDIT_V249.loading=false;
    renderSupervisionV245();
    toast('Timeline could not be loaded.',true);
    return
  }

  SUP_CONTENT_EDIT_V249.waitTimer=setTimeout(function(){
    waitForSupervisionTimelineV249(unitId,Number(attempt||0)+1)
  },100)
}

function startSupervisionContentEditV249(){
  if(!CURRENT_SUPERVISION_V245||!CURRENT_SUPERVISION_V245.unitId)return;
  if(CURRENT_SUPERVISION_V245.archive)return;

  var unitId=String(CURRENT_SUPERVISION_V245.unitId||'');
  resetSupervisionEditV248();

  SUP_CONTENT_EDIT_V249={
    active:true,
    unitId:unitId,
    draft:null,
    snapshot:null,
    saving:false,
    loading:true,
    armed:{},
    waitTimer:0
  };

  renderSupervisionV245();

  if(initializeSupervisionContentDraftV249(unitId))return;

  // Reuse the existing lazy Timeline request. If one is already running,
  // loadSupervisionTimelineV248 will not start a duplicate request.
  loadSupervisionTimelineV248(unitId,false);
  waitForSupervisionTimelineV249(unitId,0)
}

// Context-sensitive entry point. This function name is already used by both
// overview and detail Edit Mode buttons.
function startSupervisionEditModeV248(){
  if(!CURRENT_SUPERVISION_V245)return;

  if(
    CURRENT_SUPERVISION_V245.unitId &&
    !CURRENT_SUPERVISION_V245.archive
  ){
    startSupervisionContentEditV249();
    return
  }

  // Existing V248 list-edit behavior.
  var h=supHomeV248();
  if(!h){
    loadSupervisionHomeV245(true);
    return
  }

  resetSupervisionContentEditV249();

  SUP_EDIT_V248={
    active:true,
    type:CURRENT_SUPERVISION_V245.type,
    draft:deepCloneV248(h),
    snapshot:deepCloneV248(h),
    saving:false,
    armed:{}
  };

  CURRENT_SUPERVISION_V245.unitId='';
  CURRENT_SUPERVISION_V245.archive=false;
  SUPERVISION_STUDENTS_VIEW_V247=false;
  renderSupervisionV245()
}
function startSupervisionEditModeV247(){startSupervisionEditModeV248()}

function cancelSupervisionContentEditV249(){
  var unitId=SUP_CONTENT_EDIT_V249.unitId;
  resetSupervisionContentEditV249();

  // Stay inside the same student/group detail.
  if(
    CURRENT_SUPERVISION_V245 &&
    CURRENT_SUPERVISION_V245.unitId===unitId
  ){
    renderSupervisionV245()
  }
}

function editSupervisionContentTextV249(index,value){
  var rows=SUP_CONTENT_EDIT_V249.draft||[];
  var x=rows[Number(index)];
  if(!x||x.Delete)return;

  if(x.Type==='NOTE'){
    x.Text=String(value==null?'':value)
  }else if(x.Type==='FILE'){
    x.File_Title=String(value==null?'':value)
  }
}

function armDeleteSupervisionContentV249(index){
  index=Number(index);
  var rows=SUP_CONTENT_EDIT_V249.draft||[];
  var x=rows[index];
  if(!x)return;

  var key=String(index);
  if(!SUP_CONTENT_EDIT_V249.armed[key]){
    SUP_CONTENT_EDIT_V249.armed[key]=true;
    renderSupervisionV245();
    return
  }

  delete SUP_CONTENT_EDIT_V249.armed[key];
  x.Delete=true;
  renderSupervisionV245()
}

function serializeSupervisionContentV249(){
  return(SUP_CONTENT_EDIT_V249.draft||[]).map(function(x){
    return{
      Log_ID:x.Log_ID||'',
      Type:x.Type||'',
      Text:x.Text||'',
      File_ID:x.File_ID||'',
      File_Title:x.File_Title||'',
      Delete:x.Delete===true
    }
  })
}

function validateSupervisionContentV249(){
  var rows=SUP_CONTENT_EDIT_V249.draft||[];
  for(var i=0;i<rows.length;i++){
    var x=rows[i];

    SUP_CONTENT_EDIT_V249.saving ||

function normalizePersonNameClientV250(value){
  var raw=String(value==null?'':value).trim().replace(/\s+/g,' ');
  if(!raw)return'';

  var letters=raw.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g,'');
  if(!letters||letters!==letters.toUpperCase())return raw;

  function norm(part){
    if(!part)return part;
    if(/^(?:[A-Z]\.){1,6}$/.test(part))return part;
    if(/^(?:I|II|III|IV|V|VI|VII|VIII|IX|X)$/.test(part))return part;
    return part.charAt(0).toUpperCase()+part.slice(1).toLowerCase()
  }

  return raw.split(' ').map(function(token){
    return token.split(/([\-'])/).map(function(part){
      return part==='-'||part==="'"?part:norm(part)
    }).join('')
  }).join(' ')
}

function canUploadSupervisionV250(){
  var ua=String(navigator.userAgent||'');
  var p=String(navigator.platform||'');
  var touch=Number(navigator.maxTouchPoints||0);

  if(navigator.userAgentData&&navigator.userAgentData.mobile===true)return false;
  if(/iPhone|iPad|iPod|Android|Mobile|Tablet/i.test(ua))return false;
  if(p==='MacIntel'&&touch>1)return false; // iPadOS desktop-class UA
  return true
}

// ------------------------- MAGANG + SKRIPSI BATCH ADD -------------------------
function parseSkripsiBatchV250(text){
  var invalid=[];
  var rows=String(text||'').split(/\r?\n/).map(function(line,index){
    line=String(line||'').trim();
    if(!line)return null;

    var p=line.split('|').map(function(x){return String(x||'').trim()});
    if(p.length<2||!p[0]||!p[1]){
      invalid.push(index+1);
      return null
    }

    return{
      Name:normalizePersonNameClientV250(p[0]),
      NPM:p[1].replace(/\s+/g,''),
      Topic:p.slice(2).join(' | ').trim()
    }
  }).filter(Boolean);

  return{rows:rows,invalid:invalid}
}

  var btn=document.getElementById(
    'syncStudentsGradesV231_'+String(id).replace(/[^A-Za-z0-9_-]/g,'_')

  if(btn){
    btn.disabled=true;

    btn.textContent='Syncing…'
  }

      }

      var added=Number(r&&r.addedToGrades||0);

      var msg='Students synced to Grades';

      if(removed>0)msg+=' · '+removed+' removed';
      if(normalized>0)msg+=' · '+normalized+' name'+(normalized===1?'':'s')+' normalized';
