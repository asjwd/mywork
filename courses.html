// -----------------------------------------------------------------------------
// POSITION LOCK
//
// The original Courses home request may still finish after the user has already
// opened Skripsi/Magang/Capstone. In old versions its late renderHome() could
// overwrite the supervision view. V251 refuses that stale home paint.
//
// User-initiated Home still works because openCoursesHome() clears
// CURRENT_SUPERVISION_V245 before calling renderHome().
// -----------------------------------------------------------------------------
var renderHomeBeforeV251=renderHome;
renderHome=function(openContent){
  if(CURRENT_SUPERVISION_V245){
    document.body.classList.add('detailOpen');
    document.body.classList.remove('homeOpen');
    renderSupervisionV245();
    return
  }

  return renderHomeBeforeV251(openContent)
};

var SUP_POSITION_KEY_V251='';
var SUP_POSITION_SCROLL_V251=0;
var renderSupervisionBeforeV251=renderSupervisionV245;

function supervisionPositionKeyV251(){
  if(!CURRENT_SUPERVISION_V245)return'';

  return[
    String(SELECTED_PERIOD_ID||''),
    String(CURRENT_SUPERVISION_V245.type||''),
    String(CURRENT_SUPERVISION_V245.unitId||''),
    SUPERVISION_STUDENTS_VIEW_V247?'STUDENTS':'MAIN',
    CURRENT_SUPERVISION_V245.archive?'ARCHIVE':'ACTIVE'
  ].join('::')
}

renderSupervisionV245=function(){
  if(!CURRENT_SUPERVISION_V245)return;

  var key=supervisionPositionKeyV251();
  var same=key===SUP_POSITION_KEY_V251;
  var y=same?Number(window.scrollY||0):0;

  document.body.classList.add('detailOpen');
  document.body.classList.remove('homeOpen');

  renderSupervisionBeforeV251();

  SUP_POSITION_KEY_V251=key;
  SUP_POSITION_SCROLL_V251=y;

  if(same){
    requestAnimationFrame(function(){
      if(
        CURRENT_SUPERVISION_V245 &&
        supervisionPositionKeyV251()===key
      ){
        window.scrollTo(0,SUP_POSITION_SCROLL_V251)
      }
    })
  }
};

// If the user explicitly leaves supervision, clear the remembered scroll key.
var openCoursesHomeBeforeV251=openCoursesHome;
openCoursesHome=function(){
  SUP_POSITION_KEY_V251='';
  SUP_POSITION_SCROLL_V251=0;
  return openCoursesHomeBeforeV251()
};

var openTeachingBeforeV251=openTeaching;
openTeaching=function(id){
  SUP_POSITION_KEY_V251='';
  SUP_POSITION_SCROLL_V251=0;
  return openTeachingBeforeV251(id)
};

var changePeriodBeforeV251=changePeriod;
changePeriod=function(id){
  SUP_POSITION_KEY_V251='';
  SUP_POSITION_SCROLL_V251=0;
  return changePeriodBeforeV251(id)
};
</script>

<script id="v252-supervision-project-snake-runtime">
// =============================================================================
// V252 — Supervision only:
// 1) Magang / Skripsi / Capstone timeline uses the same line-and-dot snake style
//    as Project Manager, newest first.
// 2) Capstone member list is two columns on normal screens.
// 3) + Note and + File become one + Add chooser (Note / Link / File).
//    File upload is offered only on laptop/desktop.
// =============================================================================

function renderCapstoneMembersReadV248(u){
  var members=Array.isArray(u.Members_Current)?u.Members_Current:(u.Members||[]);
  if(!members.length)return'';
  return'<div class="supervisionMembersListV252">'+members.map(function(m){
    return'<div class="supervisionMemberRowV246"><div class="supervisionMemberMainV246">'+
      esc((m.NPM?m.NPM+' · ':'')+m.Name)+
    '</div></div>'
  }).join('')+'</div>'
}

function supervisionTimelineColsV252(){
  var w=window.innerWidth||1200;
  return w<=620?2:w<=980?3:4
}

function supervisionTimelineNodeV252(l,index){
  var type=String(l&&l.Type||'').toUpperCase();
  var side=index%2===0?'above':'below';
  var pending=!!(l&&l._Pending);
  var text='';

  if(type==='NOTE'){
    text='<span>[+Note] '+esc(l.Text||'')+'</span>'
  }else{
    var icon=supervisionFileIconV247({
      URL:l.File_URL||'',
      Title:l.File_Title||'',
      File_Type:l.File_Type||''
    });
    var isLink=type==='LINK'||String(l&&l.File_Type||'').toUpperCase()==='LINK';
    text='<span>'+(isLink?'[+Link] ':'[+File] ')+'</span><a href="'+esc(l.File_URL||'#')+'" target="_blank" rel="noopener">'+
      '<span class="supervisionFileIconV247">'+icon+'</span>'+esc(l.File_Title||'File')+
    '</a>'
  }

  return'<div class="supProjectSnakeNodeV252 '+(pending?'pending':'')+'">'+
    '<div class="supProjectSnakeDotV252"></div>'+ 
    '<div class="supProjectSnakeLabelV252 '+side+'">'+
      '<div class="supProjectSnakeDateV252">'+esc(l.Date||'')+'</div>'+ 
      '<div class="supProjectSnakeTextV252">'+text+(pending?'<span class="supProjectSnakePendingV252"> · processing…</span>':'')+'</div>'+ 
    '</div>'+ 
  '</div>'
}

function renderSupervisionTimelineV248(items){
  items=(items||[]).slice().sort(function(a,b){
    return Number(b.Date_MS||0)-Number(a.Date_MS||0)
  });
  if(!items.length)return'<div class="placeholder">No notes or files yet.</div>';

  var cols=supervisionTimelineColsV252();
  var html='<div class="supProjectSnakeV252">';
  for(var start=0,rowNo=0;start<items.length;start+=cols,rowNo++){
    var part=items.slice(start,start+cols);
    var dir=rowNo%2===0?'forward':'reverse';

function renderSupervisionUnitDetailV248(){

  if(!packet||!packet.unit){
    return'<button class="btn supervisionBackV245" type="button" onclick="backFromSupervisionV245()">← Back</button>'+ 
      '<div class="placeholder">'+(SUP_UNIT_META_LOADING_V248[unitId]?'Loading…':'Loading supervision…')+'</div>'

  var actions=archive

      '<div><h2>'+esc(u.Name||'Supervision')+'</h2><div class="muted">'+esc(sub.join(' · '))+'</div>'+members+'</div>'+ 
      '<div class="supervisionActionsV245">'+actions+'</div>'+

}

function setStudentModeV206(mode) {
  var id = CURRENT_TEACHING_ID;

  }
}

<script id="v256-courses-runtime">
var STUDENT_SEARCH_V256={};
var GRADE_STATE_V256={};

function v256SearchState(id){return STUDENT_SEARCH_V256[id]||(STUDENT_SEARCH_V256[id]={page:'list',query:'',npm:'',data:null,loading:false})}

// Reuse all existing Students modes/table/actions. Only add a search navigation footer.

  (p.assignments||[]).forEach(x=>{

function v256LoadGradeSetup(id,force){
  var s=v256State(id);if(s.loading||s.busy)return;
  if(s.loaded&&!force){renderTeaching();return}
  s.loading=true;if(CURRENT_TEACHING_ID===id)renderTeaching();

    s.loading=false;s.loaded=true;s.configured=!!r.configured;
    s.plan=r.plan;s.items=r.scoreItems||[];s.results=null;s.step=0;
    if(CURRENT_TEACHING_ID===id)renderTeaching();

  }).withFailureHandler(function(e){s.loading=false;if(CURRENT_TEACHING_ID===id)renderTeaching();toast(errText(e),true)}).getCourseGradingSetupV256(id,ACCESS_KEY);
}
function v256LoadResults(id){

    .withFailureHandler(function(e){toast(errText(e),true)}).getCourseGradingResultsV256(id,ACCESS_KEY);

}
function v256GradingMainTotal(s){return(s.plan.components||[]).reduce((sum,x)=>sum+(Number(x.weight)||0),0)}
function renderGradingV256(id){
  var s=v256State(id);
  if(!s.plan)return '<div class="placeholder">No grading plan loaded.</div>';

function v256BeginConfig(){var s=v256State(CURRENT_TEACHING_ID);s.step=1;renderTeaching()}
function v256ChangeMain(id,field,value){var s=v256State(CURRENT_TEACHING_ID),x=(s.plan.components||[]).find(c=>c.id===id);if(x){x[field]=field==='weight'?value:String(value);s.plan.gradedAt=''} }
function v256AddComponent(){var s=v256State(CURRENT_TEACHING_ID);s.plan.components.push({id:'c'+Date.now().toString(36),name:'',weight:0});renderTeaching()}
function v256RemoveComponent(id){var s=v256State(CURRENT_TEACHING_ID);s.plan.components=s.plan.components.filter(c=>c.id!==id);s.plan.allocations=s.plan.allocations.filter(a=>a.componentId!==id);s.plan.gradedAt='';renderTeaching()}
function renderGradeConfigV256(id){
  var s=v256State(id),total=v256GradingMainTotal(s),valid=Math.abs(total-100)<.00001&&s.plan.components.every(x=>String(x.name).trim()&&Number.isFinite(Number(x.weight))&&Number(x.weight)>=0);

    '<div class="v256GradeMainRow"><input aria-label="Component name" placeholder="Component" value="'+esc(c.name)+'" onchange="v256ChangeMain(decodeURIComponent(\''+v256Enc(c.id)+'\'),\'name\',this.value)">'+
    '<input aria-label="Weight percent" type="number" min="0" max="100" step="0.01" value="'+esc(c.weight)+'" onchange="v256ChangeMain(decodeURIComponent(\''+v256Enc(c.id)+'\'),\'weight\',this.value);renderTeaching()">'+
    '<button class="mini danger" type="button" onclick="v256RemoveComponent(decodeURIComponent(\''+v256Enc(c.id)+'\'))">×</button></div>'
  ).join('')+'</div><div class="v256GradeTotal">Total: '+esc(Math.round(total*100)/100)+'% / 100%</div>'+
  '<div class="v256GradingActions" style="margin-top:13px"><button class="btn" onclick="v256AddComponent()">+ Component</button><button class="btn" onclick="v256CancelEdit()">Cancel</button>'+ 
  '<button class="btn" '+(valid?'':'disabled')+' onclick="v256NextGradeStep()">Next →</button></div>';

function v256NextGradeStep(){var s=v256State(CURRENT_TEACHING_ID),total=v256GradingMainTotal(s);if(Math.abs(total-100)>0.00001){toast('Total components must be 100%.',true);return}var seen={};for(var c of s.plan.components){if(!String(c.name).trim()||seen[c.name.trim().toLowerCase()]){toast('Component names must be filled and unique.',true);return}seen[c.name.trim().toLowerCase()]=true} s.step=2;renderTeaching()}
function v256CancelEdit(){var id=CURRENT_TEACHING_ID,s=v256State(id);s.loaded=false;s.step=0;v256LoadGradeSetup(id,true)}
function v256AllocFor(header){var s=v256State(CURRENT_TEACHING_ID);return(s.plan.allocations||[]).find(a=>a.header===header)||null}
function v256Move(header,componentId){var s=v256State(CURRENT_TEACHING_ID),old=v256AllocFor(header);if(old){s.plan.allocations=s.plan.allocations.filter(a=>a.header!==header)}if(componentId)s.plan.allocations.push({header:header,componentId:componentId,weight:old?old.weight:0});s.plan.gradedAt='';renderTeaching()}

function v256DragStart(event,header){GRADE_DRAG_V256=header;if(event&&event.dataTransfer)event.dataTransfer.setData('text/plain',header)}
function v256Drop(event,componentId){if(event){event.preventDefault()}var header=(event&&event.dataTransfer&&event.dataTransfer.getData('text/plain'))||GRADE_DRAG_V256;if(header)v256Move(header,componentId);GRADE_DRAG_V256=''}

function v256PlanWeightStatus(s){

function capGalleryClearDragV261(root){if(!root)return;root.querySelectorAll('.dropTarget,.dragging').forEach(function(t){t.classList.remove('dropTarget','dragging')})}

// On private iPhone sessions, authenticated Drive thumbnail URLs may be blocked.
// Fall back to the existing authenticated endpoint ONCE for a photo; compact
// the returned Drive preview to a 360px JPEG in-browser and retain it in memory.
var CAP_GALLERY_FALLBACK_LOADING_V261={};
function capGalleryFallbackV260(img,uid,pid){
  var key=uid+'::'+pid;
  if(img.dataset.fallback==='1'||CAP_GALLERY_FALLBACK_LOADING_V261[key])return;
  img.dataset.fallback='1';CAP_GALLERY_FALLBACK_LOADING_V261[key]=true;
  google.script.run.withSuccessHandler(function(r){
    delete CAP_GALLERY_FALLBACK_LOADING_V261[key];if(!r||!r.ok||!r.dataUrl)return;
    var tmp=new Image();tmp.onload=function(){
      try{
        var max=360,ratio=Math.min(1,max/Math.max(tmp.naturalWidth,tmp.naturalHeight));
        var c=document.createElement('canvas');c.width=Math.max(1,Math.round(tmp.naturalWidth*ratio));c.height=Math.max(1,Math.round(tmp.naturalHeight*ratio));
        c.getContext('2d').drawImage(tmp,0,0,c.width,c.height);
        CAP_GALLERY_THUMBS_V260[key]=c.toDataURL('image/jpeg',0.68);
      }catch(e){CAP_GALLERY_THUMBS_V260[key]=r.dataUrl}
      var root=document.getElementById('capGalleryV260');
      if(root&&root.dataset.capUnit===uid){
        root.querySelectorAll('[data-cap-img]').forEach(function(node){if(node.dataset.capImg===pid)node.src=CAP_GALLERY_THUMBS_V260[key]});
      }
    };tmp.src=r.dataUrl;
  }).withFailureHandler(function(){delete CAP_GALLERY_FALLBACK_LOADING_V261[key]})
    .getCapstoneGalleryThumbnailV260(uid,pid,ACCESS_KEY);
}

<style id="v262-supervision-scroll-lock">

<script id="v262-supervision-shared-gallery-scroll">
function isSupervisionGalleryDetailV262(){

// The existing V251 scroll restoration can run in the next animation frame;
// install a final guard that restores the Y position from THIS render rather
// than a shared mutable value from any intervening async operation.
var supervisionRendererBeforeV262=renderSupervisionV245;
var SUP_RENDER_SCROLL_SEQUENCE_V262=0;
renderSupervisionV245=function(){

  var currentKey=supervisionPositionKeyV251();
  var previouslyRenderedKey=SUP_POSITION_KEY_V251;
  var samePage=currentKey&&currentKey===previouslyRenderedKey;
  var x=window.scrollX||0, y=window.scrollY||document.documentElement.scrollTop||0;
  var sequence=++SUP_RENDER_SCROLL_SEQUENCE_V262;
  var out=supervisionRendererBeforeV262();
  if(!samePage||supervisionPositionKeyV251()!==currentKey)return out;
  // Synchronous correction avoids a visible flash at the top of the page.
  window.scrollTo(x,y);
  requestAnimationFrame(function(){
    if(sequence===SUP_RENDER_SCROLL_SEQUENCE_V262 && supervisionPositionKeyV251()===currentKey){
      window.scrollTo(x,y);

  return out;
};
</script>
