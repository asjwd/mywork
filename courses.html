<script id="v213-submission-fast-review-runtime">
// =============================================================================
// V213_FAST_SCORE_CLASS_NO_NAV_PREFETCH_20260920
// - Score UI updates immediately; save runs quietly in the background.
// - Async score completion never re-renders / scrolls / resets another student.
// - Reader navigation is Class + attendance No, with compact previous/next controls.
// - No jump instruction / swipe hint text; swipe itself still works.
// - File cards show assignment title, not the uploaded filename.
// - 5 seconds after a reader opens, the next attendance-number submission in the
//   same class is silently prefetched. Its first PDF preview is also warmed.
// =============================================================================
var SUBMISSION_PREFETCH_TIMER_V213 = 0;
var SUBMISSION_PREFETCH_INFLIGHT_V213 = {};
var SUBMISSION_SCORE_STATE_V213 = {};
var SUBMISSION_PDF_PREFETCH_NODE_V213 = null;

function submissionRowsForClassV213(cls){
  var s=SUBMISSION_REVIEW_V212;
  if(!s)return[];
  var wanted=String(cls||'');
  return (s.rows||[]).filter(function(r){
    return String(r.Class||'')===wanted;
  }).slice().sort(function(a,b){
    var an=Number(a.No||0)||Number.MAX_SAFE_INTEGER;
    var bn=Number(b.No||0)||Number.MAX_SAFE_INTEGER;
    if(an!==bn)return an-bn;
    return String(a.Name||'').localeCompare(String(b.Name||''));
  });
}

function submissionClassesV213(){
  var s=SUBMISSION_REVIEW_V212;
  if(!s)return[];
  var preferred=(s.assignment&&Array.isArray(s.assignment.Classes))?s.assignment.Classes.slice():[];
  var seen={};
  var out=[];
  preferred.forEach(function(c){
    c=String(c||'').trim();
    if(c&&!seen[c]){seen[c]=1;out.push(c)}
  });
  (s.rows||[]).forEach(function(r){
    var c=String(r.Class||'').trim();
    if(c&&!seen[c]){seen[c]=1;out.push(c)}
  });
  return out;
}

function submissionCurrentRowV213(){
  var s=SUBMISSION_REVIEW_V212;
  if(!s||!s.rows||s.currentIndex<0)return null;
  return s.rows[s.currentIndex]||null;
}

function submissionGoClassV213(value){
  var s=SUBMISSION_REVIEW_V212,current=submissionCurrentRowV213();
  if(!s||!current)return;
  var cls=String(value||''),rows=submissionRowsForClassV213(cls);
  if(!rows.length)return;
  var currentNo=Number(current.No||0);
  var target=rows.find(function(r){return Number(r.No||0)===currentNo})||rows[0];
  openSubmissionStudentV212(target.NPM);
}

function submissionGoNoV213(value){
  var s=SUBMISSION_REVIEW_V212,current=submissionCurrentRowV213();
  if(!s||!current)return;
  var wanted=Number(value);
  if(!wanted)return;
  var row=submissionRowsForClassV213(current.Class).find(function(r){
    return Number(r.No||0)===wanted;
  });
  if(row)openSubmissionStudentV212(row.NPM);
}

function submissionNavigateV212(delta){
  var s=SUBMISSION_REVIEW_V212,current=submissionCurrentRowV213();
  if(!s||!current)return;
  var rows=submissionRowsForClassV213(current.Class);
  var pos=rows.findIndex(function(r){return String(r.NPM)===String(current.NPM)});
  var next=pos+Number(delta||0);
  if(pos<0||next<0||next>=rows.length)return;
  openSubmissionStudentV212(rows[next].NPM);
}

function submissionNavHtmlV213(){
  var current=submissionCurrentRowV213();
  if(!current)return'';

  var classes=submissionClassesV213();
  var classRows=submissionRowsForClassV213(current.Class);
  var pos=classRows.findIndex(function(r){return String(r.NPM)===String(current.NPM)});
  var prevDisabled=pos<=0?' disabled':'';
  var nextDisabled=pos<0||pos>=classRows.length-1?' disabled':'';

  var classSelect=
    '<select class="submissionClassSelectV213" data-student-mode-keep="1" aria-label="Class" onchange="submissionGoClassV213(this.value)">'+
      classes.map(function(c){
        return '<option value="'+esc(c)+'" '+(String(c)===String(current.Class)?'selected':'')+'>'+esc(c)+'</option>';
      }).join('')+
    '</select>';

  var noSelect=
    '<select class="submissionNoSelectV213" data-student-mode-keep="1" aria-label="Attendance number" onchange="submissionGoNoV213(this.value)">'+
      classRows.map(function(r){
        var scored=r.Scored?' class="submissionScoredOptionV213" style="color:#6f7672"':'';
        return '<option value="'+esc(r.No||'')+'"'+scored+' '+(String(r.NPM)===String(current.NPM)?'selected':'')+'>'+esc(r.No||'—')+'</option>';
      }).join('')+
    '</select>';

  return '<div class="submissionTopNavV213">'+
    classSelect+
    '<button class="submissionArrowV213 prev" type="button" aria-label="Previous student"'+prevDisabled+' onclick="submissionNavigateV212(-1)">‹</button>'+
    noSelect+
    '<button class="submissionArrowV213 next" type="button" aria-label="Next student"'+nextDisabled+' onclick="submissionNavigateV212(1)">›</button>'+
  '</div>';
}

function submissionScoreKeyV213(aid,npm){
  return String(aid||'')+'::'+String(npm||'');
}

function submissionScoreStateV213(aid,npm){
  var key=submissionScoreKeyV213(aid,npm);
  if(!SUBMISSION_SCORE_STATE_V213[key]){
    SUBMISSION_SCORE_STATE_V213[key]={
      busy:false,
      queued:null,
      seq:0,
      savedValue:null,
      error:''
    };
  }
  return SUBMISSION_SCORE_STATE_V213[key];
}

function submissionScoreButtonStateV213(npm,stateText,error){
  var s=SUBMISSION_REVIEW_V212;
  if(!s||!s.current||String(s.current.NPM)!==String(npm))return;
  var btn=document.getElementById('submissionSaveScoreBtnV213');
  if(!btn)return;
  btn.textContent=stateText||'Save Score';
  btn.classList.toggle('saving',stateText==='Saving…');
  btn.classList.toggle('error',!!error);
}

function flushSubmissionScoreV213(aid,npm){
  var state=submissionScoreStateV213(aid,npm);
  if(state.busy||state.queued===null)return;

  var value=state.queued;
  state.queued=null;
  state.busy=true;
  var seq=++state.seq;

  submissionScoreButtonStateV213(npm,'Saving…',false);

  google.script.run
    .withSuccessHandler(function(res){
      state.busy=false;
      state.error='';

      // Never touch another student's DOM or force a render/scroll here.
      // Only reconcile memory/cache for this exact student.
      if(seq===state.seq){
        var s=SUBMISSION_REVIEW_V212;
        if(s&&String(s.assignmentId)===String(aid)){
          var row=(s.rows||[]).find(function(x){
            return String(x.NPM)===String(npm);
          });
          if(row){
            row.Score=res&&res.Scored?res.Score:'';
            row.Scored=!!(res&&res.Scored);
            row.Inactive=!!(res&&res.Inactive);
          }

          var cacheKey=submissionCacheKeyV212(aid,npm);
          var cached=SUBMISSION_READER_CACHE_V212[cacheKey];
          if(cached){
            cached.Score=res&&res.Scored?res.Score:'';
            cached.Scored=!!(res&&res.Scored);
            cached.Inactive=!!(res&&res.Inactive);
          }

          if(s.current&&String(s.current.NPM)===String(npm)){
            s.current.Score=res&&res.Scored?res.Score:'';
            s.current.Scored=!!(res&&res.Scored);
            s.current.Inactive=!!(res&&res.Inactive);
            var badge=document.getElementById('submissionScoreBadgeV213');
            if(badge){
              badge.className=s.current.Scored?'badge open':'badge';
              badge.textContent=s.current.Scored?'✅ Scored':'Not scored';
            }
          }
        }

        delete GRADES[CURRENT_TEACHING_ID];
        try{sessionStorage.removeItem(secKey(CURRENT_TEACHING_ID,'grades'))}catch(e){}
        submissionScoreButtonStateV213(npm,'Saved',false);
        setTimeout(function(){
          var st=submissionScoreStateV213(aid,npm);
          if(!st.busy&&st.queued===null)submissionScoreButtonStateV213(npm,'Save Score',false);
        },900);
      }

      if(state.queued!==null)flushSubmissionScoreV213(aid,npm);
    })
    .withFailureHandler(function(e){
      state.busy=false;
      state.error=errText(e);
      submissionScoreButtonStateV213(npm,'Retry save',true);
      toast('Score not saved: '+state.error,true);
      if(state.queued!==null)flushSubmissionScoreV213(aid,npm);
    })
    .saveAssignmentSubmissionScoreV212(aid,npm,value,ACCESS_KEY);
}

function saveSubmissionScoreV212(){
  var s=SUBMISSION_REVIEW_V212;
  var r=s&&s.current;
  var input=document.getElementById('submissionScoreV212');
  if(!s||!r||!input)return;

  var raw=String(input.value==null?'':input.value).trim();
  if(raw&&!/^\d+(?:\.\d+)?$/.test(raw)){
    toast('Score must be 0–100.',true);
    return;
  }
  if(raw&&(Number(raw)<0||Number(raw)>100)){
    toast('Score must be 0–100.',true);
    return;
  }

  var optimisticScored=!!raw;
  var optimisticValue=optimisticScored
    ?Math.round(Number(raw)*100)/100
    :'';

  if(r.Inactive){
    optimisticScored=true;
    optimisticValue=0;
    raw='0';
    input.value='0';
  }

  // If the optimistic value is already the visible state and nothing failed/pends,
  // clicking Save again is a no-op.
  var state=submissionScoreStateV213(s.assignmentId,r.NPM);
  var sameVisible=String(r.Scored?String(r.Score):'')===String(optimisticScored?optimisticValue:'');
  if(sameVisible&&!state.busy&&state.queued===null&&!state.error){
    submissionScoreButtonStateV213(r.NPM,'Saved',false);
    setTimeout(function(){submissionScoreButtonStateV213(r.NPM,'Save Score',false)},700);
    return;
  }

  // Optimistic UI/memory update NOW.
  r.Score=optimisticValue;
  r.Scored=optimisticScored;
  var row=(s.rows||[]).find(function(x){
    return String(x.NPM)===String(r.NPM);
  });
  if(row){
    row.Score=optimisticValue;
    row.Scored=optimisticScored;
  }
  SUBMISSION_READER_CACHE_V212[submissionCacheKeyV212(s.assignmentId,r.NPM)]=r;

  var badge=document.getElementById('submissionScoreBadgeV213');
  if(badge){
    badge.className=optimisticScored?'badge open':'badge';
    badge.textContent=optimisticScored?'✅ Scored':'Not scored';
  }

  state.error='';
  state.queued=raw;
  flushSubmissionScoreV213(s.assignmentId,r.NPM);
}

function cancelSubmissionPrefetchV213(){
  clearTimeout(SUBMISSION_PREFETCH_TIMER_V213);
  SUBMISSION_PREFETCH_TIMER_V213=0;
}

function submissionNextRowV213(){
  var current=submissionCurrentRowV213();
  if(!current)return null;
  var rows=submissionRowsForClassV213(current.Class);
  var pos=rows.findIndex(function(r){return String(r.NPM)===String(current.NPM)});
  return pos>=0&&pos<rows.length-1?rows[pos+1]:null;
}

function warmSubmissionPdfV213(packet){
  var files=packet&&Array.isArray(packet.Files)?packet.Files:[];
  var first=files.find(function(f){return f&&f.Is_PDF&&f.Preview_URL});
  if(!first)return;

  if(!SUBMISSION_PDF_PREFETCH_NODE_V213){
    var iframe=document.createElement('iframe');
    iframe.id='submissionPdfPrefetchV213';
    iframe.className='submissionPdfPrefetchV213';
    iframe.setAttribute('aria-hidden','true');
    iframe.setAttribute('tabindex','-1');
    iframe.setAttribute('referrerpolicy','no-referrer');
    document.body.appendChild(iframe);
    SUBMISSION_PDF_PREFETCH_NODE_V213=iframe;
  }

  if(String(SUBMISSION_PDF_PREFETCH_NODE_V213.src||'')!==String(first.Preview_URL||'')){
    SUBMISSION_PDF_PREFETCH_NODE_V213.src=first.Preview_URL;
  }
}

function prefetchSubmissionV213(row){
  var s=SUBMISSION_REVIEW_V212;
  if(!s||!row)return;

  var key=submissionCacheKeyV212(s.assignmentId,row.NPM);
  if(SUBMISSION_READER_CACHE_V212[key]){
    warmSubmissionPdfV213(SUBMISSION_READER_CACHE_V212[key]);
    return;
  }
  if(SUBMISSION_PREFETCH_INFLIGHT_V213[key])return;

  SUBMISSION_PREFETCH_INFLIGHT_V213[key]=true;
  google.script.run
    .withSuccessHandler(function(packet){
      delete SUBMISSION_PREFETCH_INFLIGHT_V213[key];
      if(packet){
        SUBMISSION_READER_CACHE_V212[key]=packet;
        warmSubmissionPdfV213(packet);
      }
      // Deliberately no render, no toast, no loader.
    })
    .withFailureHandler(function(){
      delete SUBMISSION_PREFETCH_INFLIGHT_V213[key];
      // Silent: prefetch failure must never disturb correction work.
    })
    .getAssignmentSubmissionReaderV212(s.assignmentId,row.NPM,ACCESS_KEY);
}

function scheduleSubmissionPrefetchV213(){
  cancelSubmissionPrefetchV213();
  var next=submissionNextRowV213();
  if(!next)return;
  SUBMISSION_PREFETCH_TIMER_V213=setTimeout(function(){
    SUBMISSION_PREFETCH_TIMER_V213=0;
    prefetchSubmissionV213(next);
  },5000);
}

function openSubmissionStudentV212(npm){
  var s=SUBMISSION_REVIEW_V212;
  if(!s)return;

  cancelSubmissionPrefetchV213();

  var idx=submissionRowIndexByNpmV212(npm);
  if(idx<0)return;

  s.currentIndex=idx;
  s.mode='reader';
  s.current=null;
  s.openPdfIndex=-1;

  var key=submissionCacheKeyV212(s.assignmentId,npm);
  var cached=SUBMISSION_READER_CACHE_V212[key];

  if(cached){
    s.current=cached;
    s.openPdfIndex=(cached.Files&&cached.Files[0]&&cached.Files[0].Is_PDF)?0:-1;
    renderSubmissionReaderV212();
    scheduleSubmissionPrefetchV213();
    return;
  }

  submissionBusyV212(true);
  google.script.run
    .withSuccessHandler(function(r){
      submissionBusyV212(false);

      if(!SUBMISSION_REVIEW_V212||
         SUBMISSION_REVIEW_V212.assignmentId!==s.assignmentId||
         SUBMISSION_REVIEW_V212.mode!=='reader')return;

      SUBMISSION_READER_CACHE_V212[key]=r;
      SUBMISSION_REVIEW_V212.current=r;
      SUBMISSION_REVIEW_V212.openPdfIndex=(r&&r.Files&&r.Files[0]&&r.Files[0].Is_PDF)?0:-1;
      renderSubmissionReaderV212();
      scheduleSubmissionPrefetchV213();
    })
    .withFailureHandler(function(e){
      s.mode='list';
      failKeepUi(e);
      renderSubmissionReviewV212();
    })
    .getAssignmentSubmissionReaderV212(s.assignmentId,npm,ACCESS_KEY);
}

function backSubmissionListV212(){
  cancelSubmissionPrefetchV213();
  if(!SUBMISSION_REVIEW_V212)return;
  SUBMISSION_REVIEW_V212.mode='list';
  SUBMISSION_REVIEW_V212.current=null;
  SUBMISSION_REVIEW_V212.openPdfIndex=-1;
  renderSubmissionListV212();
}

function closeSubmissionReviewV212(){
  cancelSubmissionPrefetchV213();
  SUBMISSION_REVIEW_V212=null;
  SUBMISSION_TOUCH_START_V212=null;
  renderTeaching();
}

function renderSubmissionReaderV212(){
  var s=SUBMISSION_REVIEW_V212;
  var host=document.getElementById('content');
  if(!s)return;

  var rows=s.rows||[];
  var r=s.current;
  var idx=s.currentIndex;

  if(!r){
    host.innerHTML=
      '<div class="submissionReviewV212">'+
        '<button class="btn" onclick="backSubmissionListV212()">← Back</button>'+
        '<div class="submissionEmptyV212" style="margin-top:12px">Loading submission…</div>'+
      '</div>';
    return;
  }

  var answers=Array.isArray(r.Answers)?r.Answers:[];
  var files=Array.isArray(r.Files)?r.Files:[];
  var assignmentTitle=String(r.Assignment_Title||(s.assignment&&s.assignment.Title)||'Submission');

  var answerHtml=answers.length
    ?answers.map(function(a){
        return '<div class="submissionAnswerV212">'+
          '<div class="submissionQuestionV212">'+esc(a.Question||'Question')+'</div>'+
          '<div class="submissionAnswerTextV212">'+esc(a.Value||'—')+'</div>'+
        '</div>';
      }).join('')
    :'<div class="submissionEmptyV212">No text/choice answers.</div>';

  var fileHtml=files.length
    ?files.map(function(f,i){
        var open=s.openPdfIndex===i&&f.Is_PDF;
        var actions='';

        if(f.Is_PDF&&f.Preview_URL){
          actions+='<button class="mini" type="button" onclick="toggleSubmissionPdfV212('+i+')">'+
            (open?'Close PDF':'Open PDF')+
          '</button>';
        }
        if(f.URL){
          actions+='<a class="mini" href="'+esc(f.URL)+'" target="_blank" rel="noopener">Open file</a>';
        }

        var meta='File '+(i+1);
        if(f.Question)meta+=' · '+String(f.Question);
        if(f.Is_PDF)meta+=' · PDF';
        else if(f.MimeType)meta+=' · '+String(f.MimeType);
        if(f.Error)meta+=' · unavailable';

        return '<div class="submissionFileV212">'+
          '<div class="submissionFileHeadV212">'+
            '<div class="submissionFileMainV212">'+
              '<div class="submissionFileTitleV213">'+esc(assignmentTitle)+'</div>'+
              '<div class="submissionFileMetaV213">'+esc(meta)+'</div>'+
            '</div>'+
            '<div class="submissionFileActionsV212">'+actions+'</div>'+
          '</div>'+
          (open
            ?'<div class="submissionPdfWrapV212">'+
               '<iframe class="submissionPdfFrameV212" src="'+esc(f.Preview_URL)+'" title="'+esc(assignmentTitle)+'" referrerpolicy="no-referrer" allow="fullscreen"></iframe>'+
             '</div>'
            :'')+
        '</div>';
      }).join('')
    :'<div class="submissionEmptyV212">No uploaded files.</div>';

  var scoreDisabled=r.Inactive?' disabled':'';
  var scoreState=submissionScoreStateV213(s.assignmentId,r.NPM);
  var saveLabel=scoreState.busy?'Saving…':(scoreState.error?'Retry save':'Save Score');
  var saveClass='btn submissionScoreSaveV213'+(scoreState.busy?' saving':'')+(scoreState.error?' error':'');
  var scoredBadge=r.Scored
    ?'<span id="submissionScoreBadgeV213" class="badge open">✅ Scored</span>'
    :'<span id="submissionScoreBadgeV213" class="badge">Not scored</span>';

  host.innerHTML=
    '<div class="submissionReviewV212 submissionReaderV212" id="submissionReaderRootV212">'+
      '<div class="submissionReviewHeadV212">'+
        '<div class="submissionReviewHeadLeftV212">'+
          '<button class="btn" type="button" onclick="closeSubmissionReviewV212()">← Course</button>'+
          '<button class="btn" type="button" onclick="backSubmissionListV212()">← Back</button>'+
        '</div>'+
        submissionNavHtmlV213()+
      '</div>'+

      '<div class="submissionStudentCardV212">'+
        '<div class="submissionStudentTopV212">'+
          '<div>'+
            '<div class="submissionStudentNameV212">'+esc(r.Name||r.NPM)+'</div>'+
            '<div class="submissionStudentMetaV212">'+
              'NPM '+esc(r.NPM)+' · No '+esc(r.No||'—')+' · '+esc(r.Class||'')+
              '<br>Submitted '+esc(r.Submission_Time||'—')+
              (r.Inactive?'<br>Nonaktif · score locked at 0':'')+
            '</div>'+
          '</div>'+
          '<div class="submissionNavV212">'+
            '<span class="badge">'+(idx+1)+' / '+rows.length+'</span>'+
            scoredBadge+
          '</div>'+
        '</div>'+

        '<div class="submissionScoreEditorV213">'+
          '<div>'+
            '<label>Score</label>'+
            '<input id="submissionScoreV212" type="number" min="0" max="100" step="0.01" value="'+
              esc(r.Scored?r.Score:'')+'"'+scoreDisabled+
              ' onchange="saveSubmissionScoreV212()" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}">'+
          '</div>'+
          '<button id="submissionSaveScoreBtnV213" class="'+saveClass+'" type="button" onclick="saveSubmissionScoreV212()"'+scoreDisabled+'>'+saveLabel+'</button>'+
        '</div>'+
      '</div>'+

      '<div class="submissionSectionV212">'+
        '<div class="submissionSectionTitleV212">Form Answers</div>'+
        answerHtml+
      '</div>'+

      '<div class="submissionSectionV212">'+
        '<div class="submissionSectionTitleV212">Files</div>'+
        fileHtml+
      '</div>'+
    '</div>';

  bindSubmissionSwipeV212();
}
</script>

<script id="v214-submission-reader-runtime">
// =============================================================================
// V214_SCORE_TOP_RIGHT_QUESTION_PDF_TITLE_20260920
// - Score input + small Save button live in the student's top-right card area.
// - Removed the old "x / y" and "Not scored / Scored" badges.
// - A scored student gets a simple ✅ immediately after the student's name.
// - File/PDF card title uses the corresponding Google Form question.
// - Removed "File 1 · ... · PDF" metadata line.
// =============================================================================

function submissionSetScoredCheckV214(npm, scored){
  var s=SUBMISSION_REVIEW_V212;
  if(!s||!s.current||String(s.current.NPM)!==String(npm))return;
  var node=document.getElementById('submissionScoredCheckV214');
  if(!node)return;
  node.textContent=scored?'✅':'';
}

function submissionScoreButtonStateV213(npm,stateText,error){
  var s=SUBMISSION_REVIEW_V212;
  if(!s||!s.current||String(s.current.NPM)!==String(npm))return;
  var btn=document.getElementById('submissionSaveScoreBtnV213');
  if(!btn)return;
  btn.textContent=stateText==='Save Score'?'Save':(stateText||'Save');
  btn.classList.toggle('saving',stateText==='Saving…');
  btn.classList.toggle('error',!!error);
}

function saveSubmissionScoreV212(){
  var s=SUBMISSION_REVIEW_V212;
  var r=s&&s.current;
  var input=document.getElementById('submissionScoreV212');
  if(!s||!r||!input)return;

  var raw=String(input.value==null?'':input.value).trim();
  if(raw&&!/^\d+(?:\.\d+)?$/.test(raw)){
    toast('Score must be 0–100.',true);
    return;
  }
  if(raw&&(Number(raw)<0||Number(raw)>100)){
    toast('Score must be 0–100.',true);
    return;
  }

  var optimisticScored=!!raw;
  var optimisticValue=optimisticScored
    ?Math.round(Number(raw)*100)/100
    :'';

  if(r.Inactive){
    optimisticScored=true;
    optimisticValue=0;
    raw='0';
    input.value='0';
  }

  var state=submissionScoreStateV213(s.assignmentId,r.NPM);
  var sameVisible=
    String(r.Scored?String(r.Score):'')===
    String(optimisticScored?optimisticValue:'');

  if(sameVisible&&!state.busy&&state.queued===null&&!state.error){
    submissionSetScoredCheckV214(r.NPM,optimisticScored);
    submissionScoreButtonStateV213(r.NPM,'Saved',false);
    setTimeout(function(){
      submissionScoreButtonStateV213(r.NPM,'Save Score',false);
    },700);
    return;
  }

  // Optimistic state immediately. No render and no scroll change.
  r.Score=optimisticValue;
  r.Scored=optimisticScored;

  var row=(s.rows||[]).find(function(x){
    return String(x.NPM)===String(r.NPM);
  });
  if(row){
    row.Score=optimisticValue;
    row.Scored=optimisticScored;
  }

  SUBMISSION_READER_CACHE_V212[
    submissionCacheKeyV212(s.assignmentId,r.NPM)
  ]=r;

  submissionSetScoredCheckV214(r.NPM,optimisticScored);

  state.error='';
  state.queued=raw;
  flushSubmissionScoreV213(s.assignmentId,r.NPM);
}

function renderSubmissionReaderV212(){
  var s=SUBMISSION_REVIEW_V212;
  var host=document.getElementById('content');
  if(!s)return;

  var r=s.current;
  if(!r){
    host.innerHTML=
      '<div class="submissionReviewV212">'+
        '<button class="btn" onclick="backSubmissionListV212()">← Back</button>'+
        '<div class="submissionEmptyV212" style="margin-top:12px">Loading submission…</div>'+
      '</div>';
    return;
  }

  var answers=Array.isArray(r.Answers)?r.Answers:[];
  var files=Array.isArray(r.Files)?r.Files:[];

  var answerHtml=answers.length
    ?answers.map(function(a){
        return '<div class="submissionAnswerV212">'+
          '<div class="submissionQuestionV212">'+esc(a.Question||'Question')+'</div>'+
          '<div class="submissionAnswerTextV212">'+esc(a.Value||'—')+'</div>'+
        '</div>';
      }).join('')
    :'<div class="submissionEmptyV212">No text/choice answers.</div>';

  var fileHtml=files.length
    ?files.map(function(f,i){
        var open=s.openPdfIndex===i&&f.Is_PDF;
        var actions='';

        if(f.Is_PDF&&f.Preview_URL){
          actions+=
            '<button class="mini" type="button" onclick="toggleSubmissionPdfV212('+i+')">'+
              (open?'Close PDF':'Open PDF')+
            '</button>';
        }

        if(f.URL){
          actions+=
            '<a class="mini" href="'+esc(f.URL)+'" target="_blank" rel="noopener">Open file</a>';
        }

        // The visible title is the exact Google Form question that produced this file.
        // Fallback is intentionally generic if legacy rows have no question text.
        var questionTitle=String(f.Question||'Attachment').trim();

        return '<div class="submissionFileV212">'+
          '<div class="submissionFileHeadV212">'+
            '<div class="submissionFileMainV212">'+
              '<div class="submissionFileQuestionV214">'+esc(questionTitle)+'</div>'+
            '</div>'+
            '<div class="submissionFileActionsV212">'+actions+'</div>'+
          '</div>'+
          (open
            ?'<div class="submissionPdfWrapV212">'+
               '<iframe class="submissionPdfFrameV212" src="'+esc(f.Preview_URL)+'" title="'+esc(questionTitle)+'" referrerpolicy="no-referrer" allow="fullscreen"></iframe>'+
             '</div>'
            :'')+
        '</div>';
      }).join('')
    :'<div class="submissionEmptyV212">No uploaded files.</div>';

  var scoreDisabled=r.Inactive?' disabled':'';
  var scoreState=submissionScoreStateV213(s.assignmentId,r.NPM);
  var saveLabel=scoreState.busy?'Saving…':(scoreState.error?'Retry':'Save');
  var saveClass=
    'btn submissionScoreSaveV214'+
    (scoreState.busy?' saving':'')+
    (scoreState.error?' error':'');

  host.innerHTML=
    '<div class="submissionReviewV212 submissionReaderV212" id="submissionReaderRootV212">'+

      '<div class="submissionReviewHeadV212">'+
        '<div class="submissionReviewHeadLeftV212">'+
          '<button class="btn" type="button" onclick="closeSubmissionReviewV212()">← Course</button>'+
          '<button class="btn" type="button" onclick="backSubmissionListV212()">← Back</button>'+
        '</div>'+
        submissionNavHtmlV213()+
      '</div>'+

      '<div class="submissionStudentCardV212">'+
        '<div class="submissionStudentTopV214">'+
          '<div class="submissionStudentIdentityV214">'+
            '<div class="submissionStudentNameV212 submissionStudentNameV214">'+
              '<span>'+esc(r.Name||r.NPM)+'</span>'+
              '<span id="submissionScoredCheckV214" class="submissionScoredCheckV214">'+
                (r.Scored?'✅':'')+
              '</span>'+
            '</div>'+
            '<div class="submissionStudentMetaV212">'+
              'NPM '+esc(r.NPM)+' · No '+esc(r.No||'—')+' · '+esc(r.Class||'')+
              '<br>Submitted '+esc(r.Submission_Time||'—')+
              (r.Inactive?'<br>Nonaktif · score locked at 0':'')+
            '</div>'+
          '</div>'+

          '<div class="submissionScoreTopV214">'+
            '<div class="submissionScoreFieldV214">'+
              '<label>Score</label>'+
              '<input id="submissionScoreV212" type="number" min="0" max="100" step="0.01" value="'+
                esc(r.Scored?r.Score:'')+'"'+scoreDisabled+
                ' onchange="saveSubmissionScoreV212()"'+
                ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}">'+
            '</div>'+
            '<button id="submissionSaveScoreBtnV213" class="'+saveClass+'" type="button" onclick="saveSubmissionScoreV212()"'+scoreDisabled+'>'+
              saveLabel+
            '</button>'+
          '</div>'+
        '</div>'+
      '</div>'+

      '<div class="submissionSectionV212">'+
        '<div class="submissionSectionTitleV212">Form Answers</div>'+
        answerHtml+
      '</div>'+

      '<div class="submissionSectionV212">'+
        '<div class="submissionSectionTitleV212">Files</div>'+
        fileHtml+
      '</div>'+
    '</div>';

  bindSubmissionSwipeV212();
}
</script>

<script id="v215-assignment-submission-runtime">
// =============================================================================
// V215_ASSIGNMENT_PROGRESS_SORT_UNMATCHED_NPM_20260920
// =============================================================================
var ASSIGNMENT_STATS_V215={};
var ASSIGNMENT_STATS_LOADING_V215={};
var SUBMISSION_SORT_V215='number';

function assignmentCountdownV215(deadline,status){
  var st=String(status||'').toUpperCase();
  if(st==='CLOSED')return'Closed';

  var d=new Date(deadline||'');
  if(isNaN(d.getTime()))return'No deadline';

  var diff=d.getTime()-Date.now();
  if(diff<=0)return'Deadline passed';

  var totalMinutes=Math.max(1,Math.floor(diff/60000));
  var days=Math.floor(totalMinutes/1440);
  var hours=Math.floor((totalMinutes%1440)/60);
  var minutes=totalMinutes%60;
  var parts=[];

  if(days)parts.push(days+' day'+(days===1?'':'s'));
  if(hours)parts.push(hours+' hour'+(hours===1?'':'s'));
  if(minutes||!parts.length)parts.push(minutes+' minute'+(minutes===1?'':'s'));

  return'Closes in '+parts.join(' ');
}

function assignmentMetaTextV215(a){
  var txt='Classes '+classesText(a.Classes)+' · '+assignmentCountdownV215(a.Deadline,a.Status);
  var t=ASSIGNMENT_STATS_V215[CURRENT_TEACHING_ID]||{};
  var stat=t[a.Assignment_ID];
  if(stat){
    txt+=' · '+Number(stat.submitted||0)+' of '+Number(stat.total||0)+' submitted';
  }
  return txt;
}

function updateAssignmentStatsDomV215(id){
  var stats=ASSIGNMENT_STATS_V215[id]||{};
  (ASSIGNMENTS[id]||[]).forEach(function(a){
    var el=document.getElementById('assignmentMetaV215_'+String(a.Assignment_ID).replace(/[^A-Za-z0-9_-]/g,'_'));
    if(!el)return;
    el.textContent=assignmentMetaTextV215(a);
  });
}

function loadAssignmentStatsV215(id,force){
  if(!id||ASSIGNMENT_STATS_LOADING_V215[id])return;
  ASSIGNMENT_STATS_LOADING_V215[id]=true;

  google.script.run
    .withSuccessHandler(function(r){
      ASSIGNMENT_STATS_LOADING_V215[id]=false;
      ASSIGNMENT_STATS_V215[id]=r&&r.stats||{};
      if(CURRENT_TEACHING_ID===id&&!SUBMISSION_REVIEW_V212){
        updateAssignmentStatsDomV215(id);
      }
    })
    .withFailureHandler(function(){
      ASSIGNMENT_STATS_LOADING_V215[id]=false;
    })
    .getCourseAssignmentStatsV215(id,ACCESS_KEY,!!force);
}

// Keep assignment loading fast; progress counts are fetched in the background.
function loadAssignmentsStageV202(id,token,done){
  if(LOAD_SEQ_V201[id]!==token)return;

  LOADING_ASSIGNMENTS[id]=true;
  if(CURRENT_TEACHING_ID===id)renderTeaching();

  google.script.run
    .withSuccessHandler(function(r){
      LOADING_ASSIGNMENTS[id]=false;
      ASSIGNMENTS[id]=r&&r.assignments||[];
      saveSectionCache(id,'assignments',ASSIGNMENTS[id]);
      if(CURRENT_TEACHING_ID===id)renderTeaching();
      setTimeout(function(){loadAssignmentStatsV215(id,false)},0);
      done&&done();
    })
    .withFailureHandler(function(e){
      LOADING_ASSIGNMENTS[id]=false;
      if(CURRENT_TEACHING_ID===id)renderTeaching();
      if(ASSIGNMENTS[id]===undefined)toast(errText(e),true);
      done&&done();
    })
    .getCourseAssignmentsV202(id,ACCESS_KEY);
}

// Final assignment card renderer.
function renderAssignmentsV209(rows,id){
  if(rows===undefined){
    return'<div class="loadingLineV201">'+
      (LOADING_ASSIGNMENTS[id]?'Loading assignments…':'Waiting for assignments…')+
      '</div>';
  }

  rows=rows||[];

  return'<div class="sectionTools">'+
    '<button class="btn" type="button" onclick="openAssignmentModalV209()">+ Assignment</button>'+
  '</div><div class="assignmentList">'+
  (rows.length?rows.map(function(a){
    var armed=DELETE_ASSIGNMENT_ARMED===a.Assignment_ID;
    var setup=String(a.Setup_Status||'');
    var closed=String(a.Status||'').toUpperCase()==='CLOSED';
    var links=[];

    if(!closed&&a.Edit_Form_URL){
      links.push('<a class="mini" href="'+esc(a.Edit_Form_URL)+'" target="_blank" rel="noopener">📋 Edit GForm</a>');
    }
    if(!closed&&a.Form_URL){
      links.push('<a class="mini" href="'+esc(a.Form_URL)+'" target="_blank" rel="noopener">📝 Form</a>');
      links.push('<button class="mini" type="button" onclick="copyAssignmentMessageV211(\''+esc(a.Assignment_ID)+'\')">🔗 Copy Form Link</button>');
    }

    if(closed&&setup==='READY'){
      links.push('<button class="mini" type="button" onclick="openSubmissionReviewV212(\''+esc(a.Assignment_ID)+'\')">🔍 Check Submission</button>');
      links.push('<button class="mini" type="button" onclick="openReopenFormV212(\''+esc(a.Assignment_ID)+'\')">↻ Reopen Form</button>');
    }

    if(a.Response_Sheet_URL){
      links.push('<a class="mini" href="'+esc(a.Response_Sheet_URL)+'" target="_blank" rel="noopener">📊 Responses</a>');
    }
    if(a.Files_Folder_URL){
      links.push('<a class="mini" href="'+esc(a.Files_Folder_URL)+'" target="_blank" rel="noopener">📁 Submissions</a>');
    }

    var hint='';
    if(setup==='WAITING_QUESTION'||setup==='WAITING_UPLOAD'){
      hint='<div class="assignmentHintV209">Tambahkan minimal satu pertanyaan lagi selain NPM di Edit GForm. Boleh File upload, link, teks, pilihan, atau beberapa pertanyaan. Lalu klik Check GForm.</div>';
    }else if(closed&&setup==='READY'){
      hint='<div class="assignmentHintV209 ready">GForm closed · submissions ready to check.</div>';
    }else if(setup==='READY'){
      hint='<div class="assignmentHintV209 ready">GForm ready.</div>';
    }

    var pending=setup==='PENDING';
    var actions='';

    if((setup==='WAITING_QUESTION'||setup==='WAITING_UPLOAD')&&a.Form_ID){
      actions+='<button class="mini" onclick="checkGFormV203Client(\''+esc(a.Assignment_ID)+'\')">✓ Check GForm</button>';
    }
    if(setup==='ERROR'){
      actions+='<button class="mini" onclick="retryAssignmentSetupV202(\''+esc(a.Assignment_ID)+'\')">Recreate GForm</button>';
    }
    if(a.Status==='OPEN'){
      actions+='<button class="mini" onclick="closeAssignmentNowV209Client(\''+esc(a.Assignment_ID)+'\')">Close now</button>';
    }
    if(EDIT_MODE&&!isPendingId(a.Assignment_ID)){
      actions+='<button class="mini danger" onclick="armDeleteAssignmentV209(\''+esc(a.Assignment_ID)+'\')">'+
        (armed?'Yes, delete':'Delete')+
      '</button>';
    }

    var safeAid=String(a.Assignment_ID).replace(/[^A-Za-z0-9_-]/g,'_');

    return'<div class="assignmentRow '+(pending?'pending':'')+'">'+
      '<div class="assignmentTop">'+
        '<div>'+
          '<div class="assignmentTitle">'+esc(a.Title)+
            (pending?' <span class="pendingSpinnerV204" aria-label="Creating"></span>':'')+
          '</div>'+
          '<div class="assignmentProgressV215" id="assignmentMetaV215_'+safeAid+'">'+
            esc(assignmentMetaTextV215(a))+
          '</div>'+
        '</div>'+
        '<span class="badge '+(a.Status==='OPEN'?'open':a.Status==='CLOSED'?'closed':'')+'">'+esc(a.Status||'DRAFT')+'</span>'+
      '</div>'+
      (a.Setup_Error?'<div class="errorText">'+esc(a.Setup_Error)+'</div>':'')+
      hint+
      (links.length?'<div class="assignmentLinks">'+links.join('')+'</div>':'')+
      (actions?'<div class="rowActions">'+actions+'</div>':'')+
    '</div>';
  }).join(''):'<div class="placeholder">No assignments yet.</div>')+
  '</div>';
}

function openSubmissionReviewV212(assignmentId){
  var a=submissionAssignmentV212(assignmentId);
  if(!a)return;

  SUBMISSION_SORT_V215='number';
  SUBMISSION_REVIEW_V212={
    assignmentId:assignmentId,
    assignment:a,
    rows:[],
    unmatched:[],
    mode:'loading',
    currentIndex:-1,
    current:null,
    openPdfIndex:-1
  };

  submissionBusyV212(true);

  google.script.run
    .withSuccessHandler(function(r){
      submissionBusyV212(false);
      if(!SUBMISSION_REVIEW_V212||SUBMISSION_REVIEW_V212.assignmentId!==assignmentId)return;

      SUBMISSION_REVIEW_V212.assignment=r&&r.assignment||a;
      SUBMISSION_REVIEW_V212.rows=r&&Array.isArray(r.rows)?r.rows:[];
      SUBMISSION_REVIEW_V212.unmatched=r&&Array.isArray(r.unmatched)?r.unmatched:[];
      SUBMISSION_REVIEW_V212.mode='list';
      renderSubmissionListV212();
    })
    .withFailureHandler(function(e){
      SUBMISSION_REVIEW_V212=null;
      failKeepUi(e);
    })
    .getAssignmentSubmissionIndexV212(assignmentId,ACCESS_KEY);
}

function submissionSortedRowsV215(){
  var s=SUBMISSION_REVIEW_V212;
  var rows=s&&Array.isArray(s.rows)?s.rows.slice():[];
  var a=s&&s.assignment||{};
  var classes=Array.isArray(a.Classes)?a.Classes:[];
  var classRank={};

  classes.forEach(function(c,i){
    classRank[String(c||'')]=i;
  });

  if(SUBMISSION_SORT_V215==='name'){
    rows.sort(function(a,b){
      return String(a.Name||'').localeCompare(String(b.Name||''))||
        String(a.Class||'').localeCompare(String(b.Class||''))||
        (Number(a.No||0)-Number(b.No||0));
    });
  }else if(SUBMISSION_SORT_V215==='time'){
    rows.sort(function(a,b){
      return Number(a.Submitted_At_MS||0)-Number(b.Submitted_At_MS||0)||
        String(a.Name||'').localeCompare(String(b.Name||''));
    });
  }else{
    rows.sort(function(a,b){
      var ar=Object.prototype.hasOwnProperty.call(classRank,String(a.Class||''))
        ?classRank[String(a.Class||'')]:Number.MAX_SAFE_INTEGER;
      var br=Object.prototype.hasOwnProperty.call(classRank,String(b.Class||''))
        ?classRank[String(b.Class||'')]:Number.MAX_SAFE_INTEGER;

      return ar-br||
        (Number(a.No||0)-Number(b.No||0))||
        String(a.Name||'').localeCompare(String(b.Name||''));
    });
  }

  return rows;
}

function setSubmissionSortV215(value){
  SUBMISSION_SORT_V215=String(value||'number');
  renderSubmissionListV212();
}

function saveUnmatchedNpmClientV215(index){
  var s=SUBMISSION_REVIEW_V212;
  if(!s)return;

  var row=(s.unmatched||[])[Number(index)];
  var input=document.getElementById('unmatchedNpmV215_'+index);
  var btn=document.getElementById('unmatchedSaveV215_'+index);

  if(!row||!input)return;

  var npm=String(input.value||'').replace(/\s+/g,'').trim();
  if(!npm){
    toast('Enter the correct NPM.',true);
    return;
  }

  if(btn){
    btn.disabled=true;
    btn.textContent='Saving…';
  }

  google.script.run
    .withSuccessHandler(function(r){
      if(!SUBMISSION_REVIEW_V212||SUBMISSION_REVIEW_V212.assignmentId!==s.assignmentId)return;

      SUBMISSION_REVIEW_V212.assignment=r&&r.assignment||SUBMISSION_REVIEW_V212.assignment;
      SUBMISSION_REVIEW_V212.rows=r&&Array.isArray(r.rows)?r.rows:[];
      SUBMISSION_REVIEW_V212.unmatched=r&&Array.isArray(r.unmatched)?r.unmatched:[];
      renderSubmissionListV212();
      toast('Data matched · '+String(r&&r.Name||npm));

      loadAssignmentStatsV215(CURRENT_TEACHING_ID,true);
    })
    .withFailureHandler(function(e){
      if(btn){
        btn.disabled=false;
        btn.textContent='Save';
      }
      failKeepUi(e);
    })
    .saveUnmatchedSubmissionNpmV215(
      s.assignmentId,
      row.Response_Key,
      npm,
      ACCESS_KEY
    );
}

function renderSubmissionListV212(){
  var s=SUBMISSION_REVIEW_V212;
  var host=document.getElementById('content');
  var rows=submissionSortedRowsV215();
  var unmatched=s&&Array.isArray(s.unmatched)?s.unmatched:[];
  var a=s&&s.assignment||{};
  var scored=rows.filter(function(r){return r.Scored}).length;
  var noun=rows.length===1?'submission':'submissions';

  var unmatchedHtml='';
  if(unmatched.length){
    unmatchedHtml=
      '<div class="unmatchedWrapV215">'+
        '<div class="unmatchedTitleV215">Unmatched submissions</div>'+
        '<div class="unmatchedMetaV215">Correct the NPM, then Save. If it matches the student roster, the submission will move into the ordered table automatically.</div>'+
        '<div class="tableWrap">'+
          '<table class="submissionTableV212 unmatchedTableV215">'+
            '<thead><tr><th>NPM</th><th>Submission time</th><th></th></tr></thead>'+
            '<tbody>'+
              unmatched.map(function(r,i){
                return'<tr>'+
                  '<td><input class="unmatchedNpmInputV215" id="unmatchedNpmV215_'+i+'" value="'+esc(r.NPM||r.Original_NPM||'')+'" inputmode="numeric"></td>'+
                  '<td>'+esc(r.Submission_Time||'—')+'</td>'+
                  '<td><button class="mini unmatchedSaveV215" id="unmatchedSaveV215_'+i+'" type="button" onclick="saveUnmatchedNpmClientV215('+i+')">Save</button></td>'+
                '</tr>';
              }).join('')+
            '</tbody>'+
          '</table>'+
        '</div>'+
      '</div>';
  }

  host.innerHTML=
    '<div class="submissionReviewV212">'+
      '<div class="submissionReviewHeadV212 submissionListHeaderV215">'+
        '<div class="submissionReviewHeadLeftV212">'+
          '<button class="btn" type="button" onclick="closeSubmissionReviewV212()">← Course</button>'+
          '<div>'+
            '<div class="submissionReviewTitleV212">'+esc(a.Title||'Check Submission')+'</div>'+
            '<div class="submissionReviewMetaV212">'+
              scored+' of '+rows.length+' '+noun+' scored'+
            '</div>'+
          '</div>'+
        '</div>'+

<script id="v220-assistant-admin-runtime">
var ASSISTANTS_V220={};

var ASSISTANT_DELETE_ARMED_V220='';

function loadAssistantsV220(id,force){
  if(!id||LOADING_ASSISTANTS_V220[id])return;
  if(!force&&ASSISTANTS_V220[id]!==undefined){renderTeaching();return}
  LOADING_ASSISTANTS_V220[id]=true;
  renderTeaching();

  google.script.run
    .withSuccessHandler(function(r){

      if(CURRENT_TEACHING_ID===id)renderTeaching();

function saveAssistantV220(){
  var id=CURRENT_TEACHING_ID;
  var n=String((document.getElementById('assistantNameV220')||{}).value||'').trim();
  var e=String((document.getElementById('assistantEmailV220')||{}).value||'').trim();
  if(!n||!e){toast('Name and email are required.',true);return}

  google.script.run
    .withSuccessHandler(function(r){
      if(!Array.isArray(ASSISTANTS_V220[id]))ASSISTANTS_V220[id]=[];
      var idx=ASSISTANTS_V220[id].findIndex(function(x){
        return x.Assistant_ID===r.assistant.Assistant_ID
      });
      if(idx>=0)ASSISTANTS_V220[id][idx]=r.assistant;
      else ASSISTANTS_V220[id].push(r.assistant);

      ASSISTANTS_V220[id].sort(function(a,b){
        return String(a.Name||'').localeCompare(String(b.Name||''))
      });
      closeModal();
      renderTeaching();
      toast('Assistant added.');
    })
    .withFailureHandler(failKeepUi)
    .addCourseAssistantV220(id,n,e,ACCESS_KEY);
}

function removeAssistantV220(id){
  if(ASSISTANT_DELETE_ARMED_V220!==id){
    ASSISTANT_DELETE_ARMED_V220=id;
    renderTeaching();
    return;
  }

  ASSISTANT_DELETE_ARMED_V220='';
  var tid=CURRENT_TEACHING_ID;
  var old=(ASSISTANTS_V220[tid]||[]).slice();
  ASSISTANTS_V220[tid]=(ASSISTANTS_V220[tid]||[]).filter(function(x){
    return x.Assistant_ID!==id
  });
  renderTeaching();

  google.script.run
    .withSuccessHandler(function(){
      toast('Assistant removed. Active correction access revoked.');
    })
    .withFailureHandler(function(e){
      ASSISTANTS_V220[tid]=old;
      renderTeaching();
      failKeepUi(e);
    })
    .removeCourseAssistantV220(id,ACCESS_KEY);
}

function openSendAssistantV220(assignmentId){
  var id=CURRENT_TEACHING_ID;
  var a=(ASSIGNMENTS[id]||[]).find(function(x){
    return x.Assignment_ID===assignmentId
  });
  if(!a)return;

  function show(){
    var rows=ASSISTANTS_V220[id]||[];
    if(!rows.length){
      toast('Add an assistant first.',true);
      return;
    }

    var opts=rows.map(function(x){
      return'<option value="'+esc(x.Assistant_ID)+'">'+
        esc(x.Name)+' · '+esc(x.Email)+
      '</option>'
    }).join('');

      '<div class="modalHead"><h3>Send to Assistant</h3><button class="iconBtn" onclick="closeModal()">×</button></div>'+
      '<div class="modalBody">'+
        '<div class="field"><label>Assistant</label><select id="sendAssistantIdV220">'+opts+'</select></div>'+
        '<div class="field"><label>Correction deadline</label><input id="sendAssistantDeadlineV220" type="datetime-local"></div>'+
        '<div class="subtle">The Assistant gateway sends the email. The link requires OTP verification and stops working automatically after this correction deadline.</div>'+

          '<button class="btn" onclick="closeModal()">Cancel</button>'+
          '<button class="btn" id="sendAssistantBtnV220" onclick="sendAssistantV220(\''+esc(assignmentId)+'\')">Send</button>'+
        '</div>'+
      '</div>'

  }

  if(ASSISTANTS_V220[id]===undefined){
    showLoader();
    google.script.run
      .withSuccessHandler(function(r){
        hideLoader();
        ASSISTANTS_V220[id]=r&&r.assistants||[];
        show();
      })
      .withFailureHandler(function(e){
        hideLoader();
        failKeepUi(e);
      })
      .getCourseAssistantsV220(id,ACCESS_KEY);
  }else{
    show();
  }
}

function sendAssistantV220(assignmentId){
  var aid=String((document.getElementById('sendAssistantIdV220')||{}).value||'');
  var dl=String((document.getElementById('sendAssistantDeadlineV220')||{}).value||'');
  var b=document.getElementById('sendAssistantBtnV220');

  if(!aid||!dl){
    toast('Select an assistant and correction deadline.',true);
    return;
  }

  if(b){b.disabled=true;b.textContent='Sending…'}

  google.script.run
    .withSuccessHandler(function(r){
      hideLoader();
      closeModal();
      toast('Assistant email sent to '+String(r&&r.assistant&&r.assistant.Name||'assistant')+'.');
    })
    .withFailureHandler(function(e){
      hideLoader();
      if(b){b.disabled=false;b.textContent='Send'}
      failKeepUi(e);
    })

// Final V220 assignment renderer. V215 behavior is preserved; one button is added
// only for CLOSED + READY assignments.
function renderAssignmentsV209(rows,id){
  if(rows===undefined){
    return'<div class="loadingLineV201">'+
      (LOADING_ASSIGNMENTS[id]?'Loading assignments…':'Waiting for assignments…')+
    '</div>';
  }

  rows=rows||[];

  return'<div class="sectionTools">'+
    '<button class="btn" type="button" onclick="openAssignmentModalV209()">+ Assignment</button>'+
  '</div><div class="assignmentList">'+
  (rows.length?rows.map(function(a){
    var armed=DELETE_ASSIGNMENT_ARMED===a.Assignment_ID;
    var setup=String(a.Setup_Status||'');
    var closed=String(a.Status||'').toUpperCase()==='CLOSED';
    var links=[];

    if(!closed&&a.Edit_Form_URL){
      links.push('<a class="mini" href="'+esc(a.Edit_Form_URL)+'" target="_blank" rel="noopener">📋 Edit GForm</a>');
    }
    if(!closed&&a.Form_URL){
      links.push('<a class="mini" href="'+esc(a.Form_URL)+'" target="_blank" rel="noopener">📝 Form</a>');
      links.push('<button class="mini" type="button" onclick="copyAssignmentMessageV211(\''+esc(a.Assignment_ID)+'\')">🔗 Copy Form Link</button>');
    }

    if(closed&&setup==='READY'){
      links.push('<button class="mini" type="button" onclick="openSubmissionReviewV212(\''+esc(a.Assignment_ID)+'\')">🔍 Check Submission</button>');
      links.push('<button class="mini" type="button" onclick="openReopenFormV212(\''+esc(a.Assignment_ID)+'\')">↻ Reopen Form</button>');
      links.push('<button class="mini" type="button" onclick="openSendAssistantV220(\''+esc(a.Assignment_ID)+'\')">✉ Send to Assistant</button>');
    }

    if(a.Response_Sheet_URL){
      links.push('<a class="mini" href="'+esc(a.Response_Sheet_URL)+'" target="_blank" rel="noopener">📊 Responses</a>');
    }
    if(a.Files_Folder_URL){
      links.push('<a class="mini" href="'+esc(a.Files_Folder_URL)+'" target="_blank" rel="noopener">📁 Submissions</a>');
    }

    var hint='';
    if(setup==='WAITING_QUESTION'||setup==='WAITING_UPLOAD'){
      hint='<div class="assignmentHintV209">Tambahkan minimal satu pertanyaan lagi selain NPM di Edit GForm. Boleh File upload, link, teks, pilihan, atau beberapa pertanyaan. Lalu klik Check GForm.</div>';
    }else if(closed&&setup==='READY'){
      hint='<div class="assignmentHintV209 ready">GForm closed · submissions ready to check.</div>';
    }else if(setup==='READY'){
      hint='<div class="assignmentHintV209 ready">GForm ready.</div>';
    }

    var pending=setup==='PENDING';
    var actions='';

    if((setup==='WAITING_QUESTION'||setup==='WAITING_UPLOAD')&&a.Form_ID){
      actions+='<button class="mini" onclick="checkGFormV203Client(\''+esc(a.Assignment_ID)+'\')">✓ Check GForm</button>';
    }
    if(setup==='ERROR'){
      actions+='<button class="mini" onclick="retryAssignmentSetupV202(\''+esc(a.Assignment_ID)+'\')">Recreate GForm</button>';
    }
    if(a.Status==='OPEN'){
      actions+='<button class="mini" onclick="closeAssignmentNowV209Client(\''+esc(a.Assignment_ID)+'\')">Close now</button>';
    }
    if(EDIT_MODE&&!isPendingId(a.Assignment_ID)){
      actions+='<button class="mini danger" onclick="armDeleteAssignmentV209(\''+esc(a.Assignment_ID)+'\')">'+
        (armed?'Yes, delete':'Delete')+
      '</button>';
    }

    var safeAid=String(a.Assignment_ID).replace(/[^A-Za-z0-9_-]/g,'_');

    return'<div class="assignmentRow '+(pending?'pending':'')+'">'+
      '<div class="assignmentTop">'+
        '<div>'+
          '<div class="assignmentTitle">'+esc(a.Title)+
            (pending?' <span class="pendingSpinnerV204" aria-label="Creating"></span>':'')+
          '</div>'+
          '<div class="assignmentProgressV215" id="assignmentMetaV215_'+safeAid+'">'+
            esc(assignmentMetaTextV215(a))+
          '</div>'+
        '</div>'+
        '<span class="badge '+(a.Status==='OPEN'?'open':a.Status==='CLOSED'?'closed':'')+'">'+esc(a.Status||'DRAFT')+'</span>'+
      '</div>'+
      (a.Setup_Error?'<div class="errorText">'+esc(a.Setup_Error)+'</div>':'')+
      hint+
      (links.length?'<div class="assignmentLinks">'+links.join('')+'</div>':'')+
      (actions?'<div class="rowActions">'+actions+'</div>':'')+
    '</div>';
  }).join(''):'<div class="placeholder">No assignments yet.</div>')+
  '</div>';
}

// Final course-detail renderer: Assistant appears directly below Students.

function renderTeaching(){
  var t=currentTeaching()||{};
  var host=document.getElementById('content');
  var tid=t.Teaching_ID||CURRENT_TEACHING_ID;

  var tasks=TASKS[tid];
  var resources=RESOURCES[tid];
  var assignments=ASSIGNMENTS[tid];
  var student=STUDENTS[tid];
  var assistants=ASSISTANTS_V220[tid];

  var header=
    '<button class="btn compactBack" type="button" onclick="backToList()">← Courses</button>'+
    '<div class="detailTop"><div>'+
      '<h2>'+esc(t.Course_Name||'Course')+'</h2>'+
      '<div class="muted">'+esc(t.Period_Label||periodLabel(selectedPeriod()))+
        ' · Classes '+esc(classesText(t.Classes||[]))+
      '</div>'+
      (t.Drive_Folder_URL
        ?'<div class="folderPills"><a class="folderPill" href="'+esc(t.Drive_Folder_URL)+'" target="_blank" rel="noopener">📁 Course Folder</a></div>'
        :'')+
    '</div></div>';

  var taskMeta=tasks===undefined
    ?(LOADING_TASKS[tid]?'Loading…':'')
    :String((tasks||[]).filter(function(x){return x.Status!=='DONE'}).length)+' open';

  var resMeta=resources===undefined
    ?(LOADING_RESOURCES[tid]?'Loading…':'')
    :String((resources||[]).length)+' items';

  var asgMeta=assignments===undefined
    ?(LOADING_ASSIGNMENTS[tid]?'Loading…':'')
    :String((assignments||[]).length)+' assignments';

  var stuMeta=student
    ?String(student.count||0)+' students'
    :(LOADING_STUDENTS[tid]?'Loading…':'');

  var astMeta=assistants===undefined
    ?(LOADING_ASSISTANTS_V220[tid]?'Loading…':'')
    :String((assistants||[]).length)+' assistant'+((assistants||[]).length===1?'':'s');

  host.innerHTML=
    header+
    fixedSectionV201('Materials',resMeta,renderResourcesV209(resources,tid))+
    fixedSectionV201('Assignments',asgMeta,renderAssignmentsV209(assignments,tid))+
    lazyAccV201('tasks','Tasks',taskMeta,renderTasksV202(tasks,tid))+
    lazyAccV201('students','Students',stuMeta,renderStudentsV206(student,tid))+
    renderGradingSectionV256(tid)+
    lazyAccV201('assistants','Assistant',astMeta,renderAssistantsV220(assistants,tid))+
    renderEditFooterV201(t);

  requestAnimationFrame(initMaterialDragV209);
}
</script>

function openSubmissionReviewV212(assignmentId){
  var a=submissionAssignmentV212(assignmentId);
  if(!a)return;

  SUBMISSION_SORT_V215='number';
  SUBMISSION_REVIEW_V212={
    assignmentId:assignmentId,
    assignment:a,
    rows:[],
    unmatched:[],
    notSubmitted:[],
    scoringEnabled:String(a.Status||'').toUpperCase()==='CLOSED',
    reviewMode:String(a.Status||'').toUpperCase()==='CLOSED'?'SCORING':'REVIEW',
    mode:'loading',
    currentIndex:-1,
    current:null,
    openPdfIndex:-1
  };

  submissionBusyV212(true);

  google.script.run
    .withSuccessHandler(function(r){
      submissionBusyV212(false);
      if(!SUBMISSION_REVIEW_V212||SUBMISSION_REVIEW_V212.assignmentId!==assignmentId)return;

      SUBMISSION_REVIEW_V212.assignment=r&&r.assignment||a;
      SUBMISSION_REVIEW_V212.rows=r&&Array.isArray(r.rows)?r.rows:[];
      SUBMISSION_REVIEW_V212.unmatched=r&&Array.isArray(r.unmatched)?r.unmatched:[];
      SUBMISSION_REVIEW_V212.notSubmitted=r&&Array.isArray(r.notSubmitted)?r.notSubmitted:[];
      SUBMISSION_REVIEW_V212.scoringEnabled=!!(r&&r.Scoring_Enabled);
      SUBMISSION_REVIEW_V212.reviewMode=r&&r.Review_Mode||(
        SUBMISSION_REVIEW_V212.scoringEnabled?'SCORING':'REVIEW'
      );
      SUBMISSION_REVIEW_V212.mode='list';
      renderSubmissionListV212();
    })
    .withFailureHandler(function(e){
      submissionBusyV212(false);
      SUBMISSION_REVIEW_V212=null;
      failKeepUi(e);
    })
    .getAssignmentSubmissionIndexV212(assignmentId,ACCESS_KEY);

      (!scoringEnabled
        ?'<div class="reviewModeBannerV228"><strong>Review mode.</strong> GForm is still open. Scoring will unlock automatically after the form is closed and this submission is refreshed/opened again.</div>'
        :'')+

<script id="v230-unmatched-reader-runtime">
var SUBMISSION_UNMATCHED_CACHE_V230={};

function submissionUnmatchedCacheKeyV230(aid,responseKey){
  return String(aid||'')+'::UNMATCHED::'+String(responseKey||'');
}

function renderSubmissionReviewV212(){
  if(!SUBMISSION_REVIEW_V212)return renderTeaching();
  if(SUBMISSION_REVIEW_V212.mode==='reader')return renderSubmissionReaderV212();
  if(SUBMISSION_REVIEW_V212.mode==='unmatchedReader')return renderUnmatchedSubmissionReaderV230();
  return renderSubmissionListV212();
}

function openUnmatchedSubmissionV230(index){
  var s=SUBMISSION_REVIEW_V212;
  if(!s)return;

  cancelSubmissionPrefetchV213();

  var row=(s.unmatched||[])[Number(index)];
  if(!row)return;

  s.mode='unmatchedReader';
  s.current=null;
  s.currentUnmatchedIndex=Number(index);
  s.currentUnmatchedRow=row;
  s.openPdfIndex=-1;

  var key=submissionUnmatchedCacheKeyV230(s.assignmentId,row.Response_Key);
  var cached=SUBMISSION_UNMATCHED_CACHE_V230[key];

  if(cached){
    if(cached.Already_Matched&&cached.Matched_NPM){
      s.mode='list';
      openSubmissionStudentV212(cached.Matched_NPM);
      return;
    }
    s.current=cached;
    s.openPdfIndex=(cached.Files&&cached.Files[0]&&cached.Files[0].Is_PDF)?0:-1;
    renderUnmatchedSubmissionReaderV230();
    return;
  }

  var host=document.getElementById('content');
  if(host){
    host.innerHTML=
      '<div class="submissionReviewV212">'+
        '<button class="btn" onclick="backSubmissionListV212()">← Back</button>'+
        '<div class="submissionEmptyV212" style="margin-top:12px">Loading unmatched submission…</div>'+
      '</div>';
  }

  google.script.run
    .withSuccessHandler(function(packet){
      if(!SUBMISSION_REVIEW_V212||SUBMISSION_REVIEW_V212.assignmentId!==s.assignmentId)return;
      if(SUBMISSION_REVIEW_V212.mode!=='unmatchedReader')return;

      if(packet&&packet.Already_Matched&&packet.Matched_NPM){
        delete SUBMISSION_UNMATCHED_CACHE_V230[key];
        SUBMISSION_REVIEW_V212.mode='list';
        openSubmissionStudentV212(packet.Matched_NPM);
        return;
      }

      SUBMISSION_UNMATCHED_CACHE_V230[key]=packet;
      SUBMISSION_REVIEW_V212.current=packet;
      SUBMISSION_REVIEW_V212.openPdfIndex=(packet&&packet.Files&&packet.Files[0]&&packet.Files[0].Is_PDF)?0:-1;
      renderUnmatchedSubmissionReaderV230();
    })
    .withFailureHandler(function(e){
      if(SUBMISSION_REVIEW_V212){SUBMISSION_REVIEW_V212.mode='list'}
      failKeepUi(e);
      renderSubmissionListV212();
    })
    .getAssignmentUnmatchedSubmissionReaderV230(
      s.assignmentId,
      row.Response_Key,
      ACCESS_KEY
    );
}

function toggleUnmatchedPdfV230(index){
  var s=SUBMISSION_REVIEW_V212;
  if(!s||s.mode!=='unmatchedReader')return;
  s.openPdfIndex=s.openPdfIndex===Number(index)?-1:Number(index);
  renderUnmatchedSubmissionReaderV230();
}

function silentArchiveMatchedV230(assignmentId,npm){
  google.script.run
    .withSuccessHandler(function(){})
    .withFailureHandler(function(e){
      try{console.warn('Background archive failed:',e&&e.message||e)}catch(ignore){}
    })
    .archiveMatchedSubmissionV230(assignmentId,npm,ACCESS_KEY);
}

function applyMatchedIndexV230(r,s){
  if(!s||!r)return;
  s.assignment=r.assignment||s.assignment;
  s.rows=Array.isArray(r.rows)?r.rows:s.rows;
  s.unmatched=Array.isArray(r.unmatched)?r.unmatched:s.unmatched;
  s.notSubmitted=Array.isArray(r.notSubmitted)?r.notSubmitted:s.notSubmitted;
  if(typeof r.Scoring_Enabled==='boolean')s.scoringEnabled=!!r.Scoring_Enabled;
  if(r.Review_Mode)s.reviewMode=r.Review_Mode;
}

function saveUnmatchedNpmClientV215(index){
  var s=SUBMISSION_REVIEW_V212;
  if(!s)return;

  var row=(s.unmatched||[])[Number(index)];
  var input=document.getElementById('unmatchedNpmV215_'+index);

<script id="v231-student-grade-sync-runtime">
var SYNC_STUDENTS_GRADES_V231={};

function syncStudentsToGradesV231Client(id){
  id=id||CURRENT_TEACHING_ID;
  if(!id||SYNC_STUDENTS_GRADES_V231[id])return;

  var btn=document.getElementById('syncStudentsGradesV231_'+String(id).replace(/[^A-Za-z0-9_-]/g,'_'));
  SYNC_STUDENTS_GRADES_V231[id]=true;

  if(btn){
    btn.disabled=true;
    btn.classList.add('syncing');
    btn.textContent='Syncing…';
  }

  google.script.run
    .withSuccessHandler(function(r){
      SYNC_STUDENTS_GRADES_V231[id]=false;

      if(r&&r.students){
        STUDENTS[id]=r.students;
        saveSectionCache(id,'students',STUDENTS[id]);
      }

      if(r&&r.grades){
        GRADES[id]=r.grades;
        saveSectionCache(id,'grades',GRADES[id]);
      }

      if(CURRENT_TEACHING_ID===id)renderTeaching();

      var added=Number(r&&r.addedToGrades||0);
      var removed=Number(r&&r.removedFromGrades||0);
      var msg='Students synced to Grades';
      if(added>0)msg+=' · '+added+' added';
      if(removed>0)msg+=' · '+removed+' removed';
      toast(msg+'.');

      // Student count changes can affect assignment submitted/total counters.
      if(typeof loadAssignmentStatsV215==='function'){
        setTimeout(function(){
          try{loadAssignmentStatsV215(id,true)}catch(e){}
        },0);
      }
    })
    .withFailureHandler(function(e){
      SYNC_STUDENTS_GRADES_V231[id]=false;

      if(btn){
        btn.disabled=false;
        btn.classList.remove('syncing');
        btn.textContent='↻ Sync Students';
      }

      failKeepUi(e);
    })
    .syncStudentsToGradesV231(id,ACCESS_KEY);
}

// next to "Open Student Sheet".

  var busy=!!SYNC_STUDENTS_GRADES_V231[id];
  var button=
    '<button data-student-mode-keep="1" '+
      'class="btn syncStudentsBtnV231'+(busy?' syncing':'')+'" '+
      'id="syncStudentsGradesV231_'+safeId+'" '+
      'type="button" '+
      (busy?'disabled ':'')+
      'onclick="syncStudentsToGradesV231Client(\''+esc(id)+'\')">'+
      (busy?'Syncing…':'↻ Sync Students')+
    '</button>';

  var marker='</div><div class="studentSheetNoteV203">';
  if(html.indexOf(marker)>=0){
    html=html.replace(marker,button+marker);
  }
  return html;
};
</script>

  if(!s)return;

  cancelSubmissionPrefetchV213();

  var row=(s.unmatched||[])[Number(index)];
  if(!row)return;

  s.mode='unmatchedReader';
  s.current=null;
  s.currentUnmatchedIndex=Number(index);
  s.currentUnmatchedRow=row;
  s.openPdfIndex=-1;

  var key=submissionUnmatchedCacheKeyV230(
    s.assignmentId,
    row.Response_Key
  );
  var cached=SUBMISSION_UNMATCHED_CACHE_V230[key];

  if(cached){
    if(cached.Already_Matched&&cached.Matched_NPM){
      s.mode='list';
      openSubmissionStudentV212(cached.Matched_NPM);
      return;
    }

    s.current=cached;
    s.openPdfIndex=(
      cached.Files&&
      cached.Files[0]&&
      cached.Files[0].Is_PDF
    )?0:-1;

    renderUnmatchedSubmissionReaderV230();
    return;
  }

  var host=document.getElementById('content');
  if(host){
    host.innerHTML=
      '<div class="submissionReviewV212">'+
        '<button class="btn" onclick="backSubmissionListV212()">← Back</button>'+
        '<div class="submissionStudentCardV212" style="margin-top:12px">'+
          '<div class="submissionStudentMetaV212">Loading submission…</div>'+
        '</div>'+
      '</div>';
  }

  google.script.run
    .withSuccessHandler(function(packet){
      if(
        !SUBMISSION_REVIEW_V212 ||
        SUBMISSION_REVIEW_V212.assignmentId!==s.assignmentId
      )return;
      if(SUBMISSION_REVIEW_V212.mode!=='unmatchedReader')return;

      if(packet&&packet.Already_Matched&&packet.Matched_NPM){
        delete SUBMISSION_UNMATCHED_CACHE_V230[key];
        SUBMISSION_REVIEW_V212.mode='list';
        openSubmissionStudentV212(packet.Matched_NPM);
        return;
      }

      SUBMISSION_UNMATCHED_CACHE_V230[key]=packet;
      SUBMISSION_REVIEW_V212.current=packet;
      SUBMISSION_REVIEW_V212.openPdfIndex=(
        packet&&
        packet.Files&&
        packet.Files[0]&&
        packet.Files[0].Is_PDF
      )?0:-1;

      renderUnmatchedSubmissionReaderV230();
    })
    .withFailureHandler(function(e){
      if(SUBMISSION_REVIEW_V212){
        SUBMISSION_REVIEW_V212.mode='list';
      }
      failKeepUi(e);
      renderSubmissionListV212();
    })
    .getAssignmentUnmatchedSubmissionReaderV233(
      s.assignmentId,
      row.Response_Key,
      ACCESS_KEY
    );
}

<script id="v235-drive-prefetch-compact-list-runtime">
var SUBMISSION_OPENED_V235={};
var SUBMISSION_DRIVE_WARMED_V235={};
var SUBMISSION_DRIVE_WARM_NODES_V235=[];
var SUBMISSION_PREFETCH_TIMERS_V235=[];

function submissionWarmDrivePreviewV235(url){
  url=String(url||'').trim();
  if(!url||SUBMISSION_DRIVE_WARMED_V235[url])return;

  SUBMISSION_DRIVE_WARMED_V235[url]=true;

  var iframe=document.createElement('iframe');
  iframe.className='submissionDriveWarmV235';
  iframe.setAttribute('aria-hidden','true');
  iframe.setAttribute('tabindex','-1');
  iframe.setAttribute('referrerpolicy','no-referrer');
  iframe.src=url;
  document.body.appendChild(iframe);

  SUBMISSION_DRIVE_WARM_NODES_V235.push(iframe);

  // Keep only a small live warm pool. Once removed, the browser/Google cache
  // still has a chance to serve the preview quickly without retaining 200 iframes.
  while(SUBMISSION_DRIVE_WARM_NODES_V235.length>8){
    var old=SUBMISSION_DRIVE_WARM_NODES_V235.shift();
    try{old.remove()}catch(e){}
  }
}

function warmSubmissionPdfV213(packet){
  var files=packet&&Array.isArray(packet.Files)?packet.Files:[];
  var first=files.find(function(f){
    return f&&f.Is_PDF&&f.Preview_URL;
  });
  if(first)submissionWarmDrivePreviewV235(first.Preview_URL);
}

function submissionNeighborRowsV235(){
  var current=submissionCurrentRowV213();
  if(!current)return{prev:null,next:null};

  var rows=submissionRowsForClassV213(current.Class);
  var pos=rows.findIndex(function(r){
    return String(r.NPM)===String(current.NPM);
  });

  return{
    prev:pos>0?rows[pos-1]:null,
    next:pos>=0&&pos<rows.length-1?rows[pos+1]:null
  };
}

function cancelSubmissionPrefetchV213(){
  clearTimeout(SUBMISSION_PREFETCH_TIMER_V213);
  SUBMISSION_PREFETCH_TIMER_V213=0;

  SUBMISSION_PREFETCH_TIMERS_V235.forEach(function(t){
    clearTimeout(t);
  });
  SUBMISSION_PREFETCH_TIMERS_V235=[];
}

function scheduleSubmissionPrefetchV213(){
  cancelSubmissionPrefetchV213();

  var s=SUBMISSION_REVIEW_V212;
  if(!s||s.mode!=='reader'||!s.current)return;

  var n=submissionNeighborRowsV235();

  // Current visible PDF gets first network priority.
  // Then warm next, followed shortly by previous.
  if(n.next){
    SUBMISSION_PREFETCH_TIMERS_V235.push(
      setTimeout(function(){
        prefetchSubmissionV213(n.next);
      },350)
    );
  }

  if(
    n.prev &&
    !SUBMISSION_OPENED_V235[String(n.prev.NPM||'')]
  ){
    SUBMISSION_PREFETCH_TIMERS_V235.push(
      setTimeout(function(){
        prefetchSubmissionV213(n.prev);
      },600)
    );
  }
}

<script id="v242-course-prefetch-and-assistant-send-runtime">

}

<script id="v244-assistant-revoke-runtime">
var ASSISTANT_REVOKE_BUSY_V244={};

function loadAssistantsV220(id,force){
  if(!id||LOADING_ASSISTANTS_V220[id])return;

  if(!force&&ASSISTANTS_V220[id]!==undefined){
    renderTeaching();
    return;
  }

  LOADING_ASSISTANTS_V220[id]=true;
  renderTeaching();

  google.script.run
    .withSuccessHandler(function(r){
      LOADING_ASSISTANTS_V220[id]=false;
      ASSISTANTS_V220[id]=r&&r.assistants||[];
      if(CURRENT_TEACHING_ID===id)renderTeaching();
    })
    .withFailureHandler(function(e){
      LOADING_ASSISTANTS_V220[id]=false;
      if(CURRENT_TEACHING_ID===id)renderTeaching();
      failKeepUi(e);
    })
    .getCourseAssistantsV244(id,ACCESS_KEY);
}

function renderAssistantsV220(rows,id){
  if(rows===undefined){
    return'<div class="placeholder">'+
      (LOADING_ASSISTANTS_V220[id]
        ?'Loading assistants…'
        :'Open Assistant to load.')+
      '</div>';
  }

  rows=rows||[];

  return'<div class="sectionTools">'+
      '<button class="btn" type="button" onclick="openAddAssistantV220()">+ Add Assistant</button>'+
    '</div>'+
    '<div class="assistantRowsV220">'+
      (rows.length?rows.map(function(a){
        var pending=!!a._Pending;
        var armed=ASSISTANT_DELETE_ARMED_V220===a.Assistant_ID;
        var active=Array.isArray(a.Active_Assignments)
          ?a.Active_Assignments
          :[];
        var current=active.length?active[0]:null;
        var busy=current
          ?!!ASSISTANT_REVOKE_BUSY_V244[current.Access_ID]
          :false;

        var revoke=current
          ?'<button class="mini danger" type="button" '+
             'title="Revoke: '+esc(current.Assignment_Title||current.Assignment_ID||'assignment')+'" '+
             (busy?'disabled ':'')+
             'onclick="revokeAssistantAssignmentV244(\''+
               esc(a.Assistant_ID)+'\',\''+
               esc(current.Access_ID)+'\')">'+
             (busy?'Revoking…':'Revoke assignment')+
           '</button>'
          :'';

        return'<div class="assistantRowV220 '+(pending?'assistantPendingV222':'')+'">'+
          '<div>'+
            '<div class="assistantNameV220">'+esc(a.Name)+'</div>'+
            '<div class="assistantEmailV220">'+esc(a.Email)+'</div>'+
          '</div>'+
          '<div class="assistantActionsV244">'+
            (pending
              ?'<span class="muted">saving…</span>'
              :revoke+
               '<button class="mini danger" type="button" onclick="removeAssistantV220(\''+
                 esc(a.Assistant_ID)+'\')">'+
                 (armed?'Yes, remove':'Remove')+
               '</button>')+
          '</div>'+
        '</div>';
      }).join('')
      :'<div class="placeholder">No assistants yet.</div>')+
    '</div>'+
    '<div class="assistantHelpV220">Assistant access is assignment-specific. The correction link is sent by the separate Gmail Assistant gateway and expires at the correction deadline.</div>';
}

function revokeAssistantAssignmentV244(assistantId,accessId){
  var tid=CURRENT_TEACHING_ID;
  if(!tid||!assistantId||!accessId)return;
  if(ASSISTANT_REVOKE_BUSY_V244[accessId])return;

  ASSISTANT_REVOKE_BUSY_V244[accessId]=true;
  renderTeaching();

  google.script.run
    .withSuccessHandler(function(r){
      delete ASSISTANT_REVOKE_BUSY_V244[accessId];

      // Optimistic local reconciliation: remove only the Access_ID that was
      // revoked. If another assignment is still active, its button remains.
      var rows=ASSISTANTS_V220[tid]||[];
      var assistant=rows.find(function(x){
        return x.Assistant_ID===assistantId;
      });

      if(assistant&&Array.isArray(assistant.Active_Assignments)){
        assistant.Active_Assignments=
          assistant.Active_Assignments.filter(function(x){
            return x.Access_ID!==accessId;
          });
        assistant.Active_Assignment_Count=
          assistant.Active_Assignments.length;
      }

      if(CURRENT_TEACHING_ID===tid)renderTeaching();

      toast(
        r&&r.alreadyRevoked
          ?'Assignment access was already revoked.'
          :'Assistant assignment access revoked.'
      );

      // Quietly reconcile with the server after the UI has already updated.
      setTimeout(function(){
        loadAssistantsV220(tid,true);
      },0);
    })
    .withFailureHandler(function(e){
      delete ASSISTANT_REVOKE_BUSY_V244[accessId];
      if(CURRENT_TEACHING_ID===tid)renderTeaching();
      failKeepUi(e);
    })
    .revokeAssistantAssignmentV244(
      tid,
      assistantId,
      accessId,
      ACCESS_KEY
    );
}

// Keep V243 Send behavior, but refresh Assistant access metadata quietly after
// a successful send so "Revoke assignment" appears without reopening the page.
function sendAssistantV222(assignmentId){
  var aid=String(
    (document.getElementById('sendAssistantIdV220')||{}).value||''
  );
  var dl=String(
    (document.getElementById('sendAssistantDeadlineV220')||{}).value||''
  );
  var b=document.getElementById('sendAssistantBtnV220');

  if(!aid||!dl){
    toast('Select an assistant and correction deadline.',true);
    return;
  }

  if(b){b.disabled=true;b.textContent='Sending…'}
  showLoader();

  google.script.run
    .withSuccessHandler(function(r){
      hideLoader();
      closeModal();

      toast(
        'Assistant email sent to '+
        String(r&&r.assistant&&r.assistant.Name||'assistant')+
        '. Drive viewer access is active.'
      );

      var tid=CURRENT_TEACHING_ID;
      if(tid){
        setTimeout(function(){
          loadAssistantsV220(tid,true);
        },0);
      }
    })
    .withFailureHandler(function(e){
      hideLoader();
      if(b){b.disabled=false;b.textContent='Send'}
      failKeepUi(e);
    })
    .sendAssignmentToAssistantV243(
      assignmentId,
      aid,
      dl,
      ACCESS_KEY
    );
}
</script>
