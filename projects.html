<script id="v191-active-team-priority">
(function(){
  function taskDueTsV191_(task){
    var raw=String(task&&task.Due||task&&task.Due_Date||'').slice(0,10);
    if(!raw)return 8640000000000000;
    var ts=Date.parse(raw+'T00:00:00');
    return Number.isFinite(ts)?ts:8640000000000000;
  }

  function activeMemberPriorityV191_(member){
    var tasks=Array.isArray(member&&member.Tasks)?member.Tasks:[];
    var nearest=8640000000000000;
    tasks.forEach(function(t){
      var ts=taskDueTsV191_(t);
      if(ts<nearest)nearest=ts;
    });
    return {
      nearest:nearest,
      count:tasks.length
    };
  }

  window.renderHomeActiveMembersV168e=function(){
    var box=document.getElementById('homeActiveTeamRows');
    if(!box||!WORK_HOME)return;

    var rows=(WORK_HOME.activeMembers||[]).slice().sort(function(a,b){
      var ap=activeMemberPriorityV191_(a);
      var bp=activeMemberPriorityV191_(b);

      // 1) Most overdue / nearest deadline first.
      if(ap.nearest!==bp.nearest)return ap.nearest-bp.nearest;

      // 2) If same urgency, member with more active tasks first.
      if(bp.count!==ap.count)return bp.count-ap.count;

      // 3) Stable fallback by name.
      return String(a&&a.Name||'').localeCompare(String(b&&b.Name||''));
    });

    box.innerHTML=rows.length
      ? rows.map(function(m){
          var tasks=(m.Tasks||[]).slice().sort(function(a,b){
            var ad=taskDueTsV191_(a),bd=taskDueTsV191_(b);
            if(ad!==bd)return ad-bd;
            return String(a&&a.Title||'').localeCompare(String(b&&b.Title||''));
          });

          var parts=tasks.map(function(t){
            return '<strong>'+esc(t.Work_ID)+'</strong> '+esc(t.Title);
          });

          return '<div class="activeTeamRowV168e">'+
            '<span class="activeTeamNameV168e">🟠 '+esc(m.Name)+'</span>'+
            '<span class="activeTeamTasksV168e">('+parts.join(', ')+')</span>'+
          '</div>';
        }).join('')
      : '<div class="rowMeta">No team member has an active task.</div>';
  };
})();
</script>

<style id="v200-auto-timeline-style">
  /* V200 — the snake itself is ONE SVG path. No separate row/bend borders,
     therefore the straight line and every bend are physically continuous. */
  .timelineSnakeV200{position:relative;margin-top:4px;overflow:visible}
  .timelineSnakePathV200{position:absolute;left:0;top:0;width:100%;z-index:0;overflow:visible;pointer-events:none}

  .timelineSnakeRowV200{position:relative;z-index:1;display:grid;grid-template-columns:repeat(var(--snake-cols),minmax(0,1fr));height:var(--snake-row);padding:8px 14px;overflow:visible}

  .timelineSnakeNodeV200.pendingV168g{opacity:.72}

<script id="v200-auto-timeline">
(function(){
  function autoTimelineDateV200(value){
    var raw=String(value||'').trim();
    var m=raw.match(/^(\d{4}-\d{2}-\d{2})/);
    if(m)return m[1];
    var d=new Date(raw);
    if(isNaN(d.getTime()))return'';
    var y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');
    return y+'-'+mo+'-'+da;
  }
  function autoTimelineSortV200(value){
    var raw=String(value||'').trim();
    if(!raw)return 0;
    var d=new Date(raw.indexOf('T')>=0?raw:raw.replace(' ','T'));
    return isNaN(d.getTime())?0:d.getTime();
  }
  function resourcePrefixV200(type){
    var t=String(type||'').toUpperCase();
    if(t==='NOTE')return '[+Note]';
    if(t==='LINK')return '[+Link]';
    if(t==='FOLDER')return '[+Folder]';
    return '[+File]';
  }
  function autoTimelineRowsV200(){
    var out=[];
    var resources=CURRENT_WORK&&Array.isArray(CURRENT_WORK.resources)?CURRENT_WORK.resources:[];
    resources.forEach(function(r){
      var type=String(r&&r.Type||'').toUpperCase();
      if(!type)return;
      var stamp=String(r.Date_Added||r.Date_Updated||'');
      if(!stamp&&r.Pending)stamp=new Date().toISOString();
      var date=autoTimelineDateV200(stamp);
      if(!date)return;
      out.push({Timeline_ID:'AUTO-RESOURCE-'+String(r.Resource_ID||''),Event_Date:date,Title:resourcePrefixV200(type)+' '+(String(r.Title||'').trim()||'Untitled'),Pending:!!r.Pending,_sort:autoTimelineSortV200(stamp)});
    });
    var tasks=CURRENT_WORK&&Array.isArray(CURRENT_WORK.tasks)?CURRENT_WORK.tasks:[];
    tasks.forEach(function(t){
      if(String(t&&t.Status||'').toUpperCase()!=='DONE')return;
      var stamp=String(t.Completed_At||t.Date_Updated||'');
      var date=autoTimelineDateV200(stamp);
      if(!date)return;
      out.push({Timeline_ID:'AUTO-TASK-'+String(t.Work_Task_ID||''),Event_Date:date,Title:'[✓Task] '+(String(t.Title||'').trim()||'Untitled task'),Pending:!!t.Sync_Pending,_sort:autoTimelineSortV200(stamp)});
    });
    out.sort(function(a,b){return Number(b._sort||0)-Number(a._sort||0)||String(b.Event_Date||'').localeCompare(String(a.Event_Date||''))||String(a.Title||'').localeCompare(String(b.Title||''))});
    return out;
  }
  function autoTimelineGeomV200(){var w=window.innerWidth||1200;if(w<=620)return{cols:2,rowH:138,mid:69,x1:90,x2:910,r:34};if(w<=980)return{cols:3,rowH:132,mid:66,x1:80,x2:920,r:32};return{cols:4,rowH:128,mid:64,x1:70,x2:930,r:30}}
  function snakePathV200(rowCount,g){
    if(rowCount<1)return'';
    var x1=g.x1,x2=g.x2,r=g.r,rowH=g.rowH,mid=g.mid,d='M '+x1+' '+mid;
    for(var i=0;i<rowCount;i++){
      var y=i*rowH+mid,nextY=(i+1)*rowH+mid,forward=(i%2===0);
      if(forward){
        if(i===rowCount-1)d+=' H '+x2;
        else d+=' H '+(x2-r)+' Q '+x2+' '+y+' '+x2+' '+(y+r)+' V '+(nextY-r)+' Q '+x2+' '+nextY+' '+(x2-r)+' '+nextY;
      }else{
        if(i===rowCount-1)d+=' H '+x1;
        else d+=' H '+(x1+r)+' Q '+x1+' '+y+' '+x1+' '+(y+r)+' V '+(nextY-r)+' Q '+x1+' '+nextY+' '+(x1+r)+' '+nextY;
      }
    }
    return d;
  }
  function autoTimelineNodeV200(r,index){var side=index%2===0?'above':'below';return '<div class="timelineSnakeNodeV200 '+(r.Pending?'pendingV168g':'')+'" data-timeline-id="'+esc(r.Timeline_ID||'')+'"><div class="timelineSnakeDotV200"></div><div class="timelineSnakeLabelV200 '+side+'"><div class="timelineSnakeDateV200">'+esc(dateLabel(r.Event_Date))+'</div><div class="timelineSnakeTitleV200">'+esc(r.Title||'')+(r.Pending?'<span class="backgroundNoteV168f"> · processing…</span>':'')+'</div></div></div>'}
  function autoTimelineSnakeV200(rows){
    if(!rows.length)return '<div class="emptyText">No file, folder, link, note, or completed-task activity yet.</div>';
    var g=autoTimelineGeomV200(),rowCount=Math.ceil(rows.length/g.cols),totalH=rowCount*g.rowH,path=snakePathV200(rowCount,g);
    var html='<div class="timelineSnakeV200" style="height:'+totalH+'px"><svg class="timelineSnakePathV200" viewBox="0 0 1000 '+totalH+'" preserveAspectRatio="none" aria-hidden="true" style="height:'+totalH+'px"><path d="'+path+'"></path></svg>';
    for(var start=0,rowNo=0;start<rows.length;start+=g.cols,rowNo++){
      var part=rows.slice(start,start+g.cols),dir=rowNo%2===0?'forward':'reverse';
      html+='<div class="timelineSnakeRowV200 '+dir+'" style="--snake-cols:'+part.length+';--snake-row:'+g.rowH+'px">';
      for(var i=0;i<part.length;i++)html+=autoTimelineNodeV200(part[i],start+i);

    }
    return html+'</div>';
  }
  window.renderTimeline=function(){var rows=autoTimelineRowsV200();return '<section class="workSection" id="timelineSection"><div class="sectionHead"><h3>Timeline</h3></div>'+autoTimelineSnakeV200(rows)+'</section>'};
  window.renderTimelineOnlyV168g=function(){var h=document.getElementById('timelineSection');if(h){var y=window.scrollY;h.outerHTML=renderTimeline();window.scrollTo(0,y)}};
  var baseRenderTaskSectionOnlyV200=window.renderTaskSectionOnly;

  var baseRenderFilesOnlyV200=window.renderFilesOnly;
  if(typeof baseRenderFilesOnlyV200==='function')window.renderFilesOnly=function(){var out=baseRenderFilesOnlyV200.apply(this,arguments);if(typeof window.renderTimelineOnlyV168g==='function')window.renderTimelineOnlyV168g();return out};
  var resizeTimerV200=null;
  window.addEventListener('resize',function(){clearTimeout(resizeTimerV200);resizeTimerV200=setTimeout(function(){if(CURRENT_WORK_ID&&CURRENT_WORK&&!WORK_EDIT_MODE&&typeof window.renderTimelineOnlyV168g==='function')window.renderTimelineOnlyV168g()},120)});
})();
</script>
